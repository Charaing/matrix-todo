<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="매트릭스">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>매트릭스 투두</title>
<style>
:root{
  --blue:#0a95ff;--slate:#5f6d73;--card:#202020;--btn:#1f1f1f;--txt:#f5f5f7;--sub:#8e8e93;--num:#cfd4db;
  --ease:cubic-bezier(.2,.85,.25,1);--spring:cubic-bezier(.34,1.45,.5,1);
  --top:max(env(safe-area-inset-top),14px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--txt);height:100%;overflow:hidden;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{display:none}
#app{position:relative;max-width:440px;margin:0 auto;height:100%;overflow:hidden}

/* ---------- screens & transitions ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;padding:var(--top) 17px 120px;will-change:transform}
.screen.in{animation:scrIn .42s var(--ease)}
.screen.out{pointer-events:none;animation:scrOut .3s var(--ease) forwards;z-index:0}
@keyframes scrIn{from{opacity:0;transform:translateX(calc(var(--dir,1) * 36px))}}
@keyframes scrOut{to{opacity:0;transform:translateX(calc(var(--dir,1) * -36px))}}
.enter .st{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 35ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes popIn{0%{opacity:0;transform:scale(.85)}60%{opacity:1;transform:scale(1.03)}100%{transform:none}}

/* ---------- glass buttons ---------- */
.glass{background:var(--btn);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 14px rgba(0,0,0,.45)}
.press{transition:transform .25s var(--spring),background .2s}
.press:active{transform:scale(.92)}
.hdr{display:flex;align-items:center;gap:12px;height:44px;margin-bottom:22px;position:relative;z-index:2}
.hdr .sp{flex:1}
.cbtn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center}
.cbtn svg{width:25px;height:25px}
.pillgrp{width:103px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 13px}
.pillgrp .ib{display:grid;place-items:center;width:30px;height:30px}
.pillgrp .ib svg{width:25px;height:25px}
.badge{width:30px;height:30px;border:1.6px solid #5a5a5e;border-radius:9px;display:grid;place-items:center;font-size:15px;font-weight:600;color:#e8e8ea}
.htitle{position:absolute;left:50%;transform:translateX(-50%);font-size:19.5px;font-weight:700;color:var(--num);letter-spacing:-.3px;white-space:nowrap}

/* ---------- checkbox ---------- */
.ck{width:20px;height:20px;flex:none;border-radius:5.5px;border:1.6px solid var(--slate);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.ck svg{width:14px;height:14px}
.ck.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.ck.sm{width:17px;height:17px;border-radius:4.5px}
.ck.sm svg{width:12px;height:12px}
.ck.pop{animation:ckPop .42s var(--spring)}
.ck.pop.on svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .32s .06s var(--ease) forwards}
@keyframes ckPop{0%{transform:scale(1)}35%{transform:scale(.72)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.strike{color:#6e6e73;text-decoration:line-through;text-decoration-thickness:1.6px;transition:color .25s}
.strike.anim{text-decoration:none;background:linear-gradient(#6e6e73,#6e6e73) left 55%/0 1.6px no-repeat;animation:strike .35s .05s var(--ease) forwards;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@keyframes strike{to{background-size:100% 1.6px}}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:21px;right:21px;bottom:22px;height:60px;border-radius:30px;display:flex;padding:3.5px;z-index:30;
  background:rgba(31,31,31,.86);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 30px rgba(0,0,0,.6)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#ececee;white-space:nowrap;z-index:1;transition:color .3s}
.tab svg{width:23px;height:23px;transition:transform .35s var(--spring)}
.tab:active svg{transform:scale(.85)}
.tab.on{color:var(--blue)}
.tabpill{position:absolute;top:3.5px;bottom:3.5px;border-radius:27px;background:#0a0a0a;transition:left .42s var(--spring),width .42s var(--spring);z-index:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- floating ---------- */
.fab{position:absolute;z-index:25;display:grid;place-items:center;border-radius:50%;bottom:90px}
.fab-l{left:16px;width:46px;height:46px}
.fab-l svg{width:25px;height:25px}
.fab-r{right:30px;width:47px;height:47px}
.fab-r svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.fab-r.open svg{transform:rotate(90deg)}
.catcher{position:absolute;inset:0;z-index:24}
.dial{position:absolute;right:17px;bottom:147px;z-index:26;display:flex;flex-direction:column;gap:15px}
.dial.m{right:22px}
.dial button{width:63px;height:63px;border-radius:21px;display:grid;place-items:center;background:rgba(32,32,32,.9);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 26px rgba(0,0,0,.6);animation:dialIn .38s var(--spring) backwards}
.dial button:nth-child(1){animation-delay:.09s}.dial button:nth-child(2){animation-delay:.06s}.dial button:nth-child(3){animation-delay:.03s}
@keyframes dialIn{from{opacity:0;transform:translateY(24px) scale(.6)}}

/* ---------- matrix ---------- */
.screen.matrix{overflow:hidden;display:flex;flex-direction:column;padding-bottom:94px}
.mx{flex:1;min-height:0;display:grid;grid-template-columns:18px 1fr 1fr;grid-template-rows:auto 1fr 1fr;column-gap:9px;margin:0 14px 0 -12px}
.colh{text-align:center;font-weight:700;font-size:15px;color:#ececee;padding-bottom:12px}
.rowh{writing-mode:vertical-rl;text-orientation:sideways;transform:rotate(180deg);text-align:center;font-weight:700;font-size:15px;color:#ececee;align-self:center}
.rowh.r2,.quad.r2{margin-top:28px}
.quad{min-height:0;overflow-y:auto;padding:15px 14px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transition:background .2s,box-shadow .2s,transform .25s var(--spring)}
.quad.hot{background:#2a2a2c;box-shadow:inset 0 0 0 1.5px var(--hc),inset 0 1px 0 rgba(255,255,255,.07);transform:scale(1.02)}
.qhead{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#a8a8ad;margin-bottom:8px}
.qhead em{font-style:normal;margin-left:auto;color:#6e6e73}
.qi{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:14px;line-height:19px;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.qi .ck{margin-top:1px}
.qt{flex:1;min-width:0;word-break:break-all}
.qt small{color:#6e6e73;font-size:11px}
.qi.dragging{opacity:.25}
.ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;background:#2c2c2e;border-radius:12px;padding:8px 10px;box-shadow:0 14px 34px rgba(0,0,0,.6);
  transition:scale .2s;font-size:14px;display:flex;gap:8px;align-items:center}
.qdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 5px 2px 0;vertical-align:middle}
.flash{animation:popIn .45s var(--ease)}

/* ---------- list cards ---------- */
.tcard{display:flex;align-items:center;height:52px;padding:0 13px 0 43px;margin-bottom:7px;border-radius:17px;background:var(--card);cursor:pointer;
  border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .25s var(--spring)}
.tcard:active{transform:scale(.98)}
.tcard .tcm{flex:1;min-width:0;margin-left:12px}
.tcard .ttl{font-size:15px;font-weight:600;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tcard .ttl span{display:inline}
.meta{display:flex;gap:5px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:4px;height:15px;background:#2c2c2e;color:#8e8e93;font-size:10.5px;padding:0 5px;border-radius:4px;font-weight:500}
.chip svg{width:10px;height:10px}
.tnode .tnode{margin-left:24px;position:relative}
.tnode .tnode::before{content:"";position:absolute;left:-14px;top:-8px;height:34px;width:11px;border-left:1.6px solid #3a3a3e;border-bottom:1.6px solid #3a3a3e;border-bottom-left-radius:9px}
.empty{color:#6c6c71;text-align:center;padding:70px 20px;font-size:14.5px;line-height:1.65}
.sect{font-size:13px;font-weight:700;color:var(--sub);margin:22px 4px 9px}

/* ---------- dashboard ---------- */
.hero{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-bottom:10px;border-radius:20px;background:var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.hero h2{font-size:18px;font-weight:700;margin-bottom:4px}
.hero p{color:#9a9a9f;font-size:13.5px}
.ring{position:relative;width:70px;height:70px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.ring .arc{animation:ring 1s var(--ease) backwards .15s}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qtile{padding:15px;border-radius:18px;background:var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);cursor:pointer}
.qtile .top{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px}
.qtile .lbl{color:#7c7c81;font-size:11.5px;margin:5px 0 9px}
.qtile .num{font-size:23px;font-weight:700}
.qtile .num small{font-size:12px;color:#7c7c81;font-weight:500}
.bar{height:4px;border-radius:2px;background:#333336;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;animation:grow .8s var(--ease) backwards .2s}
@keyframes grow{from{width:0}}

/* ---------- calendar ---------- */
.screen.calendar{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.screen.calendar .hdr{margin-bottom:30px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:14px;color:var(--num);margin-bottom:12px}
.wk .sun{color:#ff4245}.wk .sat{color:var(--blue)}
.cgwrap{flex:0 1 auto;min-height:0;overflow:hidden}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,59px));row-gap:9px;column-gap:1.5px;touch-action:pan-y;height:100%}
.cgrid.ms{animation:mSlide .38s var(--ease)}
@keyframes mSlide{from{opacity:0;transform:translateX(calc(var(--dir) * 60px))}}
.cell{border-radius:13px;padding-top:5px;text-align:center;font-size:15px;font-weight:500;color:var(--num);cursor:pointer;overflow:hidden;border:1.5px solid transparent;min-height:0;
  transition:background .25s,border-color .25s}
.cell.sun{color:#ff4245}
.cell.out{color:#4a4a4d}
.cell.pick{background:#1f1f20}
.cell.pick.pop,.cell.today.pop{animation:selPop .35s var(--spring)}
@keyframes selPop{from{transform:scale(.86)}}
.cell.today{border-color:#123456;background:#00070c;color:var(--blue)}
.cell .bars{display:flex;flex-direction:column;gap:2.5px;padding:6px 4px 0}
.cell .bars i{height:3px;border-radius:1.5px;display:block;background:#8a8f94}
.cell .more{font-size:9px;color:#6e6e73;margin-top:1px}
.daysheet{flex:1 0 200px;position:relative;margin:14px -17px 0;background:#212121;border-radius:24px 24px 0 0;
  box-shadow:inset 0 1px 0 #2e2e2e;padding:22px 20px 0;display:flex;flex-direction:column;min-height:0}
.daysheet .dlist{overflow-y:auto;flex:1;min-height:0;padding-bottom:150px}
.daysheet h3{font-size:17px;font-weight:700;text-align:center;color:#e5e5ea;margin-top:6px}
.daysheet .sub{text-align:center;color:#5d5d62;font-size:15px;line-height:1.5;margin-top:10px}
.daysheet .anim{animation:rise .4s var(--ease)}
.drow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #2c2c2e;cursor:pointer}
.drow:last-child{border:0}
.drow .ttl{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .tm{color:var(--sub);font-size:12.5px}
.evdot{width:10px;height:10px;border-radius:3px;margin:0 5px;flex:none}
.dacts{position:absolute;left:16px;right:17px;bottom:90px;display:flex;align-items:center;gap:12px;z-index:5}
.dacts .pb{width:47px;height:37px;border-radius:19px;display:grid;place-items:center}
.dacts .pb svg{width:23px;height:23px}
.addpill{margin-left:auto;height:36px;border-radius:18px;padding:0 13px 0 16px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.addpill svg{width:18px;height:18px;transition:transform .35s var(--spring)}
.addpill.open svg{transform:rotate(45deg)}

/* ---------- chat ---------- */
.screen.chat{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:4px 2px 10px}
.dsep{align-self:center;color:#77777c;font-size:11.5px;background:#1a1a1c;padding:4px 12px;border-radius:12px;margin:10px 0 4px}
.mrow{display:flex;flex-direction:column;align-items:flex-end}
.bub{background:var(--blue);color:#fff;padding:9px 14px;border-radius:19px 19px 5px 19px;max-width:78%;font-size:15.5px;line-height:1.4;word-break:break-word;white-space:pre-wrap;cursor:pointer;transition:transform .2s var(--spring)}
.bub:active{transform:scale(.96)}
.bub.flash{animation:bubIn .4s var(--spring);transform-origin:right bottom}
@keyframes bubIn{from{opacity:0;transform:scale(.6) translateY(10px)}}
.mtime{font-size:10.5px;color:#66666b;margin:3px 4px 0}
.macts{display:flex;gap:6px;margin-top:6px;animation:rise .25s var(--ease)}
.macts button{background:#2a2a2d;border-radius:14px;padding:6px 12px;font-size:13px}
.macts .del{color:#ff6b6b}
.cin{display:flex;gap:8px;align-items:center;padding:8px 0 96px}
.cin input{flex:1;height:44px;border-radius:22px;border:1px solid #333336;background:#1c1c1e;padding:0 18px;outline:none;font-size:16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.send svg{width:21px;height:21px}

/* ---------- editor ---------- */
#modal .mwrap{position:fixed;inset:0;z-index:50;background:#17171c;max-width:440px;margin:0 auto;overflow:hidden}
#modal .mwrap.anim{animation:up .46s var(--ease)}
#modal .mwrap.closing{animation:down .3s var(--ease) forwards}
#modal .mwrap.anim .sec{animation:rise .5s var(--ease) backwards}
#modal .mwrap.anim .sec:nth-child(2){animation-delay:.04s}#modal .mwrap.anim .sec:nth-child(3){animation-delay:.08s}
#modal .mwrap.anim .sec:nth-child(4){animation-delay:.12s}#modal .mwrap.anim .sec:nth-child(5){animation-delay:.16s}
#modal .mwrap.anim .sec:nth-child(n+6){animation-delay:.2s}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.mtop{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:var(--top) 20px 14px;
  background:linear-gradient(rgba(23,23,28,.92) 60%,rgba(23,23,28,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mtop .cbtn{background:#36363c;border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.xcirc,.sc{width:25px;height:25px;border-radius:50%;background:#828288;display:grid;place-items:center;color:#36363c;transition:background .25s,transform .3s var(--spring)}
.xcirc svg{width:14px;height:14px}
.sc svg{width:15px;height:15px}
.savebtn.ok .sc{background:#22b3ff;color:#0b2a40;transform:scale(1.08)}
.datepill{position:relative;height:35px;border-radius:18px;background:#35353b;display:flex;align-items:center;gap:6px;padding:0 13px 0 16px;font-size:17px;font-weight:700;
  border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.datepill svg{width:18px;height:18px}
.datepill input,.dchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.mbody{height:100%;overflow-y:auto;padding:calc(var(--top) + 64px) 20px 60px}
.sec{background:#333338;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:18px 20px;margin-bottom:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:31px}
.sec h4{font-size:15px;font-weight:700;color:#e5e5ea}
.hr{height:1px;background:#46464b;margin:15px 0}
.tin{width:100%;height:55px;margin-top:14px;background:transparent;border:1.75px solid #606066;border-radius:13px;padding:0 16px;font-size:16px;outline:none;transition:border-color .2s}
.tin:focus{border-color:#7a7a82}
.tin::placeholder{color:#6c6c72}
.sel{position:relative;display:flex;align-items:center;gap:5px;color:#7c7c82;font-size:15px}
.sel.slate{color:#5f6d73}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:none;color:inherit;font-size:15px;text-align:right;cursor:pointer;direction:rtl}
.sel select option{background:#2a2a2d;color:#fff;direction:ltr}
.sel svg{width:15px;height:15px}
.sel .ic svg{width:19px;height:19px}
.seg{position:relative;display:flex;background:#27272c;border-radius:16px;padding:2px;width:160px;height:31px}
.seg button{flex:1;position:relative;z-index:1;border-radius:14px;color:#e5e5ea;font-size:15px}
.seg .knob{position:absolute;top:2px;bottom:2px;left:2px;border-radius:14px;background:#5c5c62;transition:transform .35s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.clrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.clrow span{flex:1;font-size:15px}
.clrow .rm{color:#77777c;width:26px;height:26px;display:grid;place-items:center}
.clrow .rm svg{width:14px;height:14px}
.cladd{display:flex;align-items:center;gap:10px;margin-top:12px}
.cladd input{flex:1;background:transparent;border:0;outline:none;font-size:15px;font-weight:600;min-width:0}
.cladd input::placeholder{color:#5d5d63}
.cladd button{width:46px;height:33px;border-radius:17px;background:#5b666c;display:grid;place-items:center;color:#83919a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.cladd button svg{width:20px;height:20px}
.wdays{display:flex;justify-content:space-between;gap:6px;margin-top:14px}
.wday{width:36px;height:36px;border-radius:50%;background:#27272c;color:#c9c9ce;font-size:14.5px;font-weight:600;transition:background .2s,color .2s,transform .25s var(--spring)}
.wday.sun{color:#ff6b6b}.wday.sat{color:#5fb4ff}
.wday.on{background:var(--slate);color:#fff}
.wquick{display:flex;gap:7px;margin-top:12px}
.wquick button{height:28px;padding:0 12px;border-radius:14px;background:#27272c;color:#a8a8ad;font-size:13px}
.qopts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.qopt{height:79px;background:#4c4c52;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:14px;color:#c9c9ce;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:transform .3s var(--spring),background .2s}
.qopt:active{transform:scale(.93)}
.qopt.on{color:#8a8a90}

  if(!t.repeat||ds<t.start)return false;
  const a=parse(t.start),b=parse(ds);

  if(/하루\s*마감|마감\s*시작|하루\s*정리|회고/.test(v))return review();
  if(/^(도움|도움말|사용법|help|\?)$|뭘\s*할\s*수|무엇을\s*할\s*수|뭐\s*할\s*수|뭐\s*해\s*줄\s*수/i.test(v))return [helpMsg()];
  if(/몇\s*(번|개|회|시간)|얼마나\s*(자주|많이)/.test(v))return [countQ(v)];
  if(/바쁜|바빠|바쁘/.test(v))return [busiest(v)];
  if(/(먼저|우선)\s*(준비|할|해야)|뭐부터|무엇부터|준비할/.test(v))return [firstQ(v)];
  if(VERB_MV.test(v))return [moveQ(v)];
  if(/(삭제|지워|지우|없애)/.test(v)||/취소\s*(해|하|시켜)/.test(v))return [pickQ(v,'del')];
  if(/(완료|끝냈|끝났|다\s*했|마쳤|해냈)/.test(v)&&!/[?？]\s*$/.test(v))return [pickQ(v,'done')];
  if(/(일정|할\s*일|할일|스케줄|약속|뭐\s*있|뭐\s*해)/.test(v)&&/(알려|보여|뭐|있어|있나|있니|[?？]|어때)/.test(v))return [listQ(v)];
  const ps=parseMulti(v);const found=ps.filter(p=>p.found);
  if(found.length)return [addCard(found)];
  if(/(추가|등록|넣어|잡아)/.test(v)&&ps[0].title)return [addCard(ps.slice(0,1))];
  if(/^(안녕|하이|hi|hello|ㅎㅇ|반가)/i.test(v))return [say('안녕하세요! 일정을 말로 추가하고, 묻고, 옮길 수 있어요. 아래 추천 문구를 눌러 보세요.')];
  if(/(고마워|감사|땡큐|ㄱㅅ|thx|thanks)/i.test(v))return [say('천만에요! 필요할 때 언제든 불러 주세요.')];
  return [say('메모로 남겨 뒀어요. 말풍선을 누르면 할 일로 바꿀 수 있어요.\n일정으로 등록하려면 날짜나 시간을 함께 말씀해 주세요.')];
}
function applyCard(c){
  const k=c.card;let n=0;
  if(k.kind==='add'){k.items.forEach(p=>{const t=toTask(p);S.tasks.push(t);n++;if(t.remind!=='none')ensurePermission()});k.doneMsg=`${n}개 등록했어요`}
  if(k.kind==='move'){k.items.forEach(it=>{const t=find(it.id);if(!t)return;const dd=dayDiff(it.from,it.to);
    if(dd){t.hasDate=true;t.start=addDays(t.start,dd);t.end=addDays(t.end,dd)}
    if(it.toTime&&it.toTime!==t.time){if(t.endTime&&t.hasTime)t.endTime=fromMin(toMin(t.endTime)+toMin(it.toTime)-toMin(t.time));t.time=it.toTime;t.hasTime=true}n++});k.doneMsg=`${n}개 옮겼어요`}
  if(k.kind==='del'){const ids=new Set(k.items.map(i=>i.id));S.tasks=S.tasks.filter(t=>!ids.has(t.id));S.tasks.forEach(t=>{if(ids.has(t.parentId))t.parentId=null});k.doneMsg=`${ids.size}개 삭제했어요`}
  if(k.kind==='done'){k.items.forEach(it=>{const t=find(it.id);if(t){t.done=true;if(t.repeat){t.doneOn=t.doneOn||{};t.doneOn[today()]=true}n++}});k.doneMsg=`${n}개 완료로 표시했어요`}
  if(k.kind==='review'){k.ids.forEach(id=>{const t=find(id);if(!t)return;t.done=!!k.checked[id];if(t.repeat){t.doneOn=t.doneOn||{};if(t.done)t.doneOn[today()]=true;else delete t.doneOn[today()]}});k.doneMsg='체크한 대로 반영했어요'}
  k.status='done';
}

function statsView(){
  const T=today(),d0=parse(T),y=d0.getFullYear(),m=d0.getMonth(),mon=mondayOf(T);
  const occ=(a,b)=>{const out=[];for(let ds=a;ds<=b;ds=addDays(ds,1))for(const t of S.tasks)if(occursOn(t,ds))out.push({t,ds});return out};
  const wk=occ(mon,addDays(mon,6)),mo=occ(ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0)));
  const l30=new Map();occ(addDays(T,-29),T).forEach(o=>l30.set(o.t.id,o.t));const d30=[...l30.values()].filter(t=>t.done).length;
  const rate=l30.size?Math.round(d30/l30.size*100):0;
  const byW=[0,0,0,0,0,0,0];occ(addDays(T,-55),T).forEach(o=>byW[parse(o.ds).getDay()]++);
  const wmax=Math.max(...byW);
  const tile=(l,v,unit,s,i)=>`<div class="stile st" style="--i:${i}"><div class="l">${l}</div><div class="v">${v}${unit?`<small>${unit}</small>`:''}</div><div class="s">${s}</div></div>`;
  const g=GROUPS.map(n=>{const os=mo.filter(o=>o.t.group===n);return {n,c:os.length,min:os.reduce((s,o)=>s+durOf(o.t),0)}});
  const useMin=g.some(x=>x.min>0);const gmax=Math.max(1,...g.map(x=>useMin?x.min:x.c));
  const fc=[];for(let i=0;i<21;i++){const ds=addDays(T,i);fc.push({ds,n:dayItems(ds).length})}

async function ensurePermission(){

  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied'){toast('설정에서 알림이 차단되어 있어요');return false}
  try{const p=await Notification.requestPermission();if(p==='granted'){toast('알림을 켰어요');return true}}catch(e){}
  return false;
}
async function notify(title,body,tag){

    if(r){await r.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return}}catch(e){}
  try{new Notification(title,{body,tag,icon:'icon-192.png'})}catch(e){}

function checkReminders(){
  const can='Notification' in window&&Notification.permission==='granted';
  const nowMs=Date.now();const t0=today();let changed=false;
  for(const t of S.tasks){
    if(t.done||!t.hasDate||!t.hasTime||!t.remind||t.remind==='none')continue;
    const off=+t.remind*60000;
    for(const k of [0,1]){
      const ds=addDays(t0,k);
      if(t.repeat?!occursOn(t,ds):ds!==t.start)continue;
      const at=parse(ds);const[h,mi]=t.time.split(':').map(Number);at.setHours(h,mi,0,0);
      const fire=at.getTime()-off;const key=t.id+'|'+ds+'|'+t.remind+'|'+t.time;
      if(nowMs>=fire&&nowMs-fire<3*3600e3&&!S.notified[key]){
        S.notified[key]=nowMs;changed=true;
        const when=t.remind==='0'?'지금':REMIND.find(r=>r[0]===t.remind)[1].replace(' 전','')+' 뒤';
        const body=`${when} · ${ds===t0?'오늘':kdate(ds)} ${t.time} · ${Q[t.quadrant].name}`;
        if(can)notify(t.title,body,key);
        if(document.visibilityState==='visible')toast(`🔔 ${t.title} — ${when}`);
      }
    }
  }
  for(const k in S.notified)if(nowMs-S.notified[k]>4*864e5){delete S.notified[k];changed=true}
  if(changed)save();
}

  if(!drag)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){clearTimeout(drag.timer);drag=null}return}
  drag.ghost.style.transform=`translate(${e.clientX-drag.ox}px,${e.clientY-drag.oy}px) scale(1.06)`;
  const q=document.elementFromPoint(e.clientX,e.clientY)?.closest('.quad');
  document.querySelectorAll('.quad.hot').forEach(x=>x!==q&&x.classList.remove('hot'));
  if(q&&!q.classList.contains('hot')){q.classList.add('hot');buzz()}
});
function endDrag(e,cancel){
  if(!drag)return;clearTimeout(drag.timer);
  if(drag.active){
    const q=!cancel&&document.elementFromPoint(e.clientX,e.clientY)?.closest('.quad');
    drag.ghost.remove();document.querySelectorAll('.quad.hot').forEach(x=>x.classList.remove('hot'));drag.el.classList.remove('dragging');
    swallowClick=true;setTimeout(()=>swallowClick=false,350);
    const t=find(drag.id);
    if(q&&t&&+q.dataset.q!==t.quadrant){t.quadrant=+q.dataset.q;ui.flash=t.id;save();render();toast(`‘${Q[t.quadrant].name}’ 영역으로 옮겼어요`)}
  }
  drag=null;
}
document.addEventListener('pointerup',e=>endDrag(e));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.qi'))e.preventDefault()});

render();
setTimeout(checkReminders,1500);
</script>
</body>
</html>
