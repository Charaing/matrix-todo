<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="매트릭스">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>매트릭스 투두</title>
<style>
:root{
  --blue:#0a95ff;--slate:#5f6d73;--card:#202020;--btn:#1f1f1f;--txt:#f5f5f7;--sub:#8e8e93;--num:#cfd4db;
  --ease:cubic-bezier(.2,.85,.25,1);--spring:cubic-bezier(.34,1.45,.5,1);
  --top:max(env(safe-area-inset-top),14px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--txt);height:100%;overflow:hidden;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{display:none}
#app{position:relative;max-width:440px;margin:0 auto;height:100%;overflow:hidden}

/* ---------- screens & transitions ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;padding:var(--top) 17px 120px;will-change:transform}
.screen.in{animation:scrIn .42s var(--ease)}
.screen.out{pointer-events:none;animation:scrOut .3s var(--ease) forwards;z-index:0}
@keyframes scrIn{from{opacity:0;transform:translateX(calc(var(--dir,1) * 36px))}}
@keyframes scrOut{to{opacity:0;transform:translateX(calc(var(--dir,1) * -36px))}}
.enter .st{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 35ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes popIn{0%{opacity:0;transform:scale(.85)}60%{opacity:1;transform:scale(1.03)}100%{transform:none}}

/* ---------- glass buttons ---------- */
.glass{background:var(--btn);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 14px rgba(0,0,0,.45)}
.press{transition:transform .25s var(--spring),background .2s}
.press:active{transform:scale(.92)}
.hdr{display:flex;align-items:center;gap:12px;height:44px;margin-bottom:22px;position:relative;z-index:2}
.hdr .sp{flex:1}
.cbtn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center}
.cbtn svg{width:25px;height:25px}
.pillgrp{width:103px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 13px}
.pillgrp .ib{display:grid;place-items:center;width:30px;height:30px}
.pillgrp .ib svg{width:25px;height:25px}
.badge{width:30px;height:30px;border:1.6px solid #5a5a5e;border-radius:9px;display:grid;place-items:center;font-size:15px;font-weight:600;color:#e8e8ea}
.htitle{position:absolute;left:50%;transform:translateX(-50%);font-size:19.5px;font-weight:700;color:var(--num);letter-spacing:-.3px;white-space:nowrap}

/* ---------- checkbox ---------- */
.ck{width:20px;height:20px;flex:none;border-radius:5.5px;border:1.6px solid var(--slate);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.ck svg{width:14px;height:14px}
.ck.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.ck.sm{width:17px;height:17px;border-radius:4.5px}
.ck.sm svg{width:12px;height:12px}
.ck.pop{animation:ckPop .42s var(--spring)}
.ck.pop.on svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .32s .06s var(--ease) forwards}
@keyframes ckPop{0%{transform:scale(1)}35%{transform:scale(.72)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.strike{color:#6e6e73;text-decoration:line-through;text-decoration-thickness:1.6px;transition:color .25s}
.strike.anim{text-decoration:none;background:linear-gradient(#6e6e73,#6e6e73) left 55%/0 1.6px no-repeat;animation:strike .35s .05s var(--ease) forwards;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@keyframes strike{to{background-size:100% 1.6px}}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:21px;right:21px;bottom:22px;height:60px;border-radius:30px;display:flex;padding:3.5px;z-index:30;
  background:rgba(31,31,31,.86);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 30px rgba(0,0,0,.6)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#ececee;white-space:nowrap;z-index:1;transition:color .3s}
.tab svg{width:23px;height:23px;transition:transform .35s var(--spring)}
.tab:active svg{transform:scale(.85)}
.tab.on{color:var(--blue)}
.tabpill{position:absolute;top:3.5px;bottom:3.5px;border-radius:27px;background:#0a0a0a;transition:left .42s var(--spring),width .42s var(--spring);z-index:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- floating ---------- */
.fab{position:absolute;z-index:25;display:grid;place-items:center;border-radius:50%;bottom:90px}
.fab-l{left:16px;width:46px;height:46px}
.fab-l svg{width:25px;height:25px}
.fab-r{right:30px;width:47px;height:47px}
.fab-r svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.fab-r.open svg{transform:rotate(90deg)}
.catcher{position:absolute;inset:0;z-index:24}
.dial{position:absolute;right:17px;bottom:147px;z-index:26;display:flex;flex-direction:column;gap:15px}
.dial.m{right:22px}
.dial button{width:63px;height:63px;border-radius:21px;display:grid;place-items:center;background:rgba(32,32,32,.9);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 26px rgba(0,0,0,.6);animation:dialIn .38s var(--spring) backwards}
.dial button:nth-child(1){animation-delay:.09s}.dial button:nth-child(2){animation-delay:.06s}.dial button:nth-child(3){animation-delay:.03s}
@keyframes dialIn{from{opacity:0;transform:translateY(24px) scale(.6)}}

/* ---------- matrix ---------- */
.screen.matrix{overflow:hidden;display:flex;flex-direction:column;padding-bottom:94px}
.mx{flex:1;min-height:0;display:grid;grid-template-columns:18px 1fr 1fr;grid-template-rows:auto 1fr 1fr;column-gap:9px;margin:0 14px 0 -12px}
.colh{text-align:center;font-weight:700;font-size:15px;color:#ececee;padding-bottom:12px}
.rowh{writing-mode:vertical-rl;text-orientation:sideways;transform:rotate(180deg);text-align:center;font-weight:700;font-size:15px;color:#ececee;align-self:center}
.rowh.r2,.quad.r2{margin-top:28px}
.quad{min-height:0;overflow-y:auto;padding:15px 14px;border-radius:18px;background:var(--card);border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transition:background .2s,box-shadow .2s,transform .25s var(--spring)}
.quad.hot{background:#2a2a2c;box-shadow:inset 0 0 0 1.5px var(--hc),inset 0 1px 0 rgba(255,255,255,.07);transform:scale(1.02)}
.qhead{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#a8a8ad;margin-bottom:8px}
.qhead em{font-style:normal;margin-left:auto;color:#6e6e73}
.qi{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:14px;line-height:19px;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.qi .ck{margin-top:1px}
.qt{flex:1;min-width:0;word-break:break-all}
.qt small{color:#6e6e73;font-size:11px}
.qi.dragging{opacity:.25}
.ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;background:#2c2c2e;border-radius:12px;padding:8px 10px;box-shadow:0 14px 34px rgba(0,0,0,.6);
  transition:scale .2s;font-size:14px;display:flex;gap:8px;align-items:center}
.qdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 5px 2px 0;vertical-align:middle}
.flash{animation:popIn .45s var(--ease)}

/* ---------- list cards ---------- */
.tcard{display:flex;align-items:center;height:52px;padding:0 13px 0 43px;margin-bottom:7px;border-radius:17px;background:var(--card);cursor:pointer;
  border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .25s var(--spring)}
.tcard:active{transform:scale(.98)}
.tcard .tcm{flex:1;min-width:0;margin-left:12px}
.tcard .ttl{font-size:15px;font-weight:600;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tcard .ttl span{display:inline}
.meta{display:flex;gap:5px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:4px;height:15px;background:#2c2c2e;color:#8e8e93;font-size:10.5px;padding:0 5px;border-radius:4px;font-weight:500}
.chip svg{width:10px;height:10px}
.tnode .tnode{margin-left:24px;position:relative}
.tnode .tnode::before{content:"";position:absolute;left:-14px;top:-8px;height:34px;width:11px;border-left:1.6px solid #3a3a3e;border-bottom:1.6px solid #3a3a3e;border-bottom-left-radius:9px}
.empty{color:#6c6c71;text-align:center;padding:70px 20px;font-size:14.5px;line-height:1.65}
.sect{font-size:13px;font-weight:700;color:var(--sub);margin:22px 4px 9px}

/* ---------- dashboard ---------- */
.hero{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-bottom:10px;border-radius:20px;background:var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.hero h2{font-size:18px;font-weight:700;margin-bottom:4px}
.hero p{color:#9a9a9f;font-size:13.5px}
.ring{position:relative;width:70px;height:70px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.ring .arc{animation:ring 1s var(--ease) backwards .15s}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qtile{padding:15px;border-radius:18px;background:var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);cursor:pointer}
.qtile .top{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px}
.qtile .lbl{color:#7c7c81;font-size:11.5px;margin:5px 0 9px}
.qtile .num{font-size:23px;font-weight:700}
.qtile .num small{font-size:12px;color:#7c7c81;font-weight:500}
.bar{height:4px;border-radius:2px;background:#333336;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;animation:grow .8s var(--ease) backwards .2s}
@keyframes grow{from{width:0}}

/* ---------- calendar ---------- */
.screen.calendar{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.screen.calendar .hdr{margin-bottom:30px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:14px;color:var(--num);margin-bottom:12px}
.wk .sun{color:#ff4245}.wk .sat{color:var(--blue)}
.cgwrap{flex:0 1 auto;min-height:0;overflow:hidden}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,59px));row-gap:9px;column-gap:1.5px;touch-action:pan-y;height:100%}
.cgrid.ms{animation:mSlide .38s var(--ease)}
@keyframes mSlide{from{opacity:0;transform:translateX(calc(var(--dir) * 60px))}}
.cell{border-radius:13px;padding-top:5px;text-align:center;font-size:15px;font-weight:500;color:var(--num);cursor:pointer;overflow:hidden;border:1.5px solid transparent;min-height:0;
  transition:background .25s,border-color .25s}
.cell.sun{color:#ff4245}
.cell.out{color:#4a4a4d}
.cell.sel{background:#1f1f20}
.cell.sel.pop,.cell.today.pop{animation:selPop .35s var(--spring)}
@keyframes selPop{from{transform:scale(.86)}}
.cell.today{border-color:#123456;background:#00070c;color:var(--blue)}
.cell .bars{display:flex;flex-direction:column;gap:2.5px;padding:6px 4px 0}
.cell .bars i{height:3px;border-radius:1.5px;display:block;background:#8a8f94}
.cell .more{font-size:9px;color:#6e6e73;margin-top:1px}
.daysheet{flex:1 0 200px;position:relative;margin:14px -17px 0;background:#212121;border-radius:24px 24px 0 0;
  box-shadow:inset 0 1px 0 #2e2e2e;padding:22px 20px 0;display:flex;flex-direction:column;min-height:0}
.daysheet .dlist{overflow-y:auto;flex:1;min-height:0;padding-bottom:150px}
.daysheet h3{font-size:17px;font-weight:700;text-align:center;color:#e5e5ea;margin-top:6px}
.daysheet .sub{text-align:center;color:#5d5d62;font-size:15px;line-height:1.5;margin-top:10px}
.daysheet .anim{animation:rise .4s var(--ease)}
.drow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #2c2c2e;cursor:pointer}
.drow:last-child{border:0}
.drow .ttl{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .tm{color:var(--sub);font-size:12.5px}
.evdot{width:10px;height:10px;border-radius:3px;margin:0 5px;flex:none}
.dacts{position:absolute;left:16px;right:17px;bottom:90px;display:flex;align-items:center;gap:12px;z-index:5}
.dacts .pb{width:47px;height:37px;border-radius:19px;display:grid;place-items:center}
.dacts .pb svg{width:23px;height:23px}
.addpill{margin-left:auto;height:36px;border-radius:18px;padding:0 13px 0 16px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.addpill svg{width:18px;height:18px;transition:transform .35s var(--spring)}
.addpill.open svg{transform:rotate(45deg)}

/* ---------- chat ---------- */
.screen.chat{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:4px 2px 10px}
.dsep{align-self:center;color:#77777c;font-size:11.5px;background:#1a1a1c;padding:4px 12px;border-radius:12px;margin:10px 0 4px}
.mrow{display:flex;flex-direction:column;align-items:flex-end}
.bub{background:var(--blue);color:#fff;padding:9px 14px;border-radius:19px 19px 5px 19px;max-width:78%;font-size:15.5px;line-height:1.4;word-break:break-word;white-space:pre-wrap;cursor:pointer;transition:transform .2s var(--spring)}
.bub:active{transform:scale(.96)}
.bub.flash{animation:bubIn .4s var(--spring);transform-origin:right bottom}
@keyframes bubIn{from{opacity:0;transform:scale(.6) translateY(10px)}}
.mtime{font-size:10.5px;color:#66666b;margin:3px 4px 0}
.macts{display:flex;gap:6px;margin-top:6px;animation:rise .25s var(--ease)}
.macts button{background:#2a2a2d;border-radius:14px;padding:6px 12px;font-size:13px}
.macts .del{color:#ff6b6b}
.cin{display:flex;gap:8px;align-items:center;padding:8px 0 96px}
.cin input{flex:1;height:44px;border-radius:22px;border:1px solid #333336;background:#1c1c1e;padding:0 18px;outline:none;font-size:16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.send svg{width:21px;height:21px}

/* ---------- editor ---------- */
#modal .mwrap{position:fixed;inset:0;z-index:50;background:#17171c;max-width:440px;margin:0 auto;overflow:hidden}
#modal .mwrap.anim{animation:up .46s var(--ease)}
#modal .mwrap.closing{animation:down .3s var(--ease) forwards}
#modal .mwrap.anim .sec{animation:rise .5s var(--ease) backwards}
#modal .mwrap.anim .sec:nth-child(2){animation-delay:.04s}#modal .mwrap.anim .sec:nth-child(3){animation-delay:.08s}
#modal .mwrap.anim .sec:nth-child(4){animation-delay:.12s}#modal .mwrap.anim .sec:nth-child(5){animation-delay:.16s}
#modal .mwrap.anim .sec:nth-child(n+6){animation-delay:.2s}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.mtop{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:var(--top) 20px 14px;
  background:linear-gradient(rgba(23,23,28,.92) 60%,rgba(23,23,28,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mtop .cbtn{background:#36363c;border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.xcirc,.sc{width:25px;height:25px;border-radius:50%;background:#828288;display:grid;place-items:center;color:#36363c;transition:background .25s,transform .3s var(--spring)}
.xcirc svg{width:14px;height:14px}
.sc svg{width:15px;height:15px}
.savebtn.ok .sc{background:#22b3ff;color:#0b2a40;transform:scale(1.08)}
.datepill{position:relative;height:35px;border-radius:18px;background:#35353b;display:flex;align-items:center;gap:6px;padding:0 13px 0 16px;font-size:17px;font-weight:700;
  border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.datepill svg{width:18px;height:18px}
.datepill input,.dchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.mbody{height:100%;overflow-y:auto;padding:calc(var(--top) + 64px) 20px 60px}
.sec{background:#333338;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:18px 20px;margin-bottom:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:31px}
.sec h4{font-size:15px;font-weight:700;color:#e5e5ea}
.hr{height:1px;background:#46464b;margin:15px 0}
.tin{width:100%;height:55px;margin-top:14px;background:transparent;border:1.75px solid #606066;border-radius:13px;padding:0 16px;font-size:16px;outline:none;transition:border-color .2s}
.tin:focus{border-color:#7a7a82}
.tin::placeholder{color:#6c6c72}
.sel{position:relative;display:flex;align-items:center;gap:5px;color:#7c7c82;font-size:15px}
.sel.slate{color:#5f6d73}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:none;color:inherit;font-size:15px;text-align:right;cursor:pointer;direction:rtl}
.sel select option{background:#2a2a2d;color:#fff;direction:ltr}
.sel svg{width:15px;height:15px}
.sel .ic svg{width:19px;height:19px}
.seg{position:relative;display:flex;background:#27272c;border-radius:16px;padding:2px;width:160px;height:31px}
.seg button{flex:1;position:relative;z-index:1;border-radius:14px;color:#e5e5ea;font-size:15px}
.seg .knob{position:absolute;top:2px;bottom:2px;left:2px;border-radius:14px;background:#5c5c62;transition:transform .35s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.clrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.clrow span{flex:1;font-size:15px}
.clrow .rm{color:#77777c;width:26px;height:26px;display:grid;place-items:center}
.clrow .rm svg{width:14px;height:14px}
.cladd{display:flex;align-items:center;gap:10px;margin-top:12px}
.cladd input{flex:1;background:transparent;border:0;outline:none;font-size:15px;font-weight:600;min-width:0}
.cladd input::placeholder{color:#5d5d63}
.cladd button{width:46px;height:33px;border-radius:17px;background:#5b666c;display:grid;place-items:center;color:#83919a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.cladd button svg{width:20px;height:20px}
.qopts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.qopt{height:79px;background:#4c4c52;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:14px;color:#c9c9ce;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:transform .3s var(--spring),background .2s}
.qopt:active{transform:scale(.93)}
.qopt.on{color:#8a8a90}
.qopt.on svg{animation:popIn .35s var(--spring)}
.qlabel{color:#7c7c82;font-size:14px}
.plink{margin-top:14px;border:1.5px dashed #5a5a60;border-radius:14px;height:47px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;color:#8e8e93;font-size:15px}
.plink svg{width:19px;height:19px}
.pcard{margin-top:14px;display:flex;align-items:center;gap:10px;background:#28282d;border-radius:14px;padding:11px 14px;animation:popIn .35s var(--ease)}
.pcard svg{width:18px;height:18px;color:#8e8e93}
.pcard span{flex:1;font-size:15px}
.colors{display:flex;justify-content:space-between;margin-top:16px;padding:0 4px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;transition:transform .3s var(--spring)}
.dot:active{transform:scale(.8)}
.dot svg{width:13px;height:13px}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid #4e4e54;opacity:0;transform:scale(.6);transition:.3s var(--spring)}
.dot.on::after{opacity:1;transform:none}
.sw{width:63px;height:27px;border-radius:14px;background:#69696f;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:37px;height:23px;border-radius:12px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .38s var(--spring)}
.sw.on{background:var(--slate)}
.sw.on::after{transform:translateX(22px)}
.coll{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.coll.open{grid-template-rows:1fr}
.coll>div{overflow:hidden}
.dchip{position:relative;background:#4e4e53;border-radius:17px;height:34px;padding:0 15px;display:flex;align-items:center;font-size:16.5px}
.delbtn{width:100%;height:52px;border-radius:18px;background:#3a2023;color:#ff6b6b;font-size:16px;font-weight:600}

/* ---------- sheets ---------- */
#sheet .bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;animation:fade .25s}
#sheet .panel{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;z-index:61;background:#1f1f22;border-radius:26px 26px 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);max-height:82%;overflow-y:auto;animation:up .4s var(--ease);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
#sheet.closing .bg{animation:fade .22s reverse forwards}
#sheet.closing .panel{animation:down .25s var(--ease) forwards}
.panel .grab{width:36px;height:5px;border-radius:3px;background:#3a3a3d;margin:0 auto 14px}
.panel h3{font-size:18px;font-weight:700;margin-bottom:12px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid #2c2c30;font-size:15.5px;cursor:pointer;width:100%;text-align:left}
.prow:last-child{border:0}
.prow .r{color:var(--sub);font-size:13.5px;text-align:right}
.prow.red{color:#ff6b6b}
.prow .rad{width:22px;height:22px;border-radius:50%;border:2px solid #55555a;flex:none;transition:.25s var(--spring)}
.prow .rad.on{border:7px solid var(--blue)}
.note{color:var(--sub);font-size:12.5px;line-height:1.55;padding:6px 4px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{padding:8px 14px;border-radius:16px;background:#2c2c30;font-size:14.5px;transition:background .2s}
.chips .on{background:var(--blue);color:#fff}
.help p{color:#a8a8ad;font-size:14.5px;line-height:1.6;margin-bottom:12px}
.hq{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.hq b{display:block;font-size:15px;margin-bottom:2px}
.hq span{color:var(--sub);font-size:13.5px}

#toast{position:fixed;left:50%;top:calc(var(--top) + 8px);transform:translate(-50%,-30px) scale(.9);opacity:0;background:rgba(48,48,52,.96);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;
  transition:transform .4s var(--spring),opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= constants ================= */
const Q=[
  {name:'실행',label:'중요함-긴급함',color:'#d23b3d',desc:'지금 바로 처리할 일'},
  {name:'계획',label:'중요함-긴급하지않음',color:'#067ad2',desc:'일정을 잡아 꾸준히 할 일'},
  {name:'위임',label:'중요하지않음-긴급함',color:'#ec9647',desc:'빠르게 끝내거나 맡길 일'},
  {name:'제거',label:'중요하지않음-긴급하지않음',color:'#7e7e82',desc:'줄이거나 하지 않아도 되는 일'}
];
const COLORS=['#5c696f','#bfa288','#a6654e','#f0d6c0','#938079','#004569','#e40d4e','#5868fe'];
const GROUPS=['기본 그룹','업무','개인','공부'];
const WD=['일','월','화','수','목','금','토'];
const REMIND=[['none','없음'],['0','정시'],['5','5분 전'],['10','10분 전'],['30','30분 전'],['60','1시간 전'],['1440','하루 전']];
const KEY='matrix-todo-v1';

const I={
gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="3.6" stroke-dasharray="3.3 3.3"/><circle cx="12" cy="12" r="6.4" fill="currentColor"/><circle cx="12" cy="12" r="2.7" fill="#1f1f1f"/></svg>',
help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.3 9.3a2.8 2.8 0 1 1 3.7 2.6c-.7.3-1 .8-1 1.5v.5"/><circle cx="12" cy="17.2" r=".5" fill="currentColor"/></svg>',
layout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="4" width="8" height="6.5" rx="1.6"/><rect x="2.5" y="13.5" width="8" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="8" height="16" rx="1.6"/></svg>',
filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M7 8.8h10M8.6 12.3h6.8M10.4 15.8h3.2"/></svg>',
plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
xl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
updown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9.5l4-4 4 4M8 14.5l4 4 4-4"/></svg>',
menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 8.8h9M7.5 12h9M7.5 15.2h9"/></svg>',
grid:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="2.5" width="8.6" height="8.6" rx="2.4"/><rect x="12.9" y="2.5" width="8.6" height="8.6" rx="2.4"/><rect x="2.5" y="12.9" width="8.6" height="8.6" rx="2.4"/><rect x="12.9" y="12.9" width="8.6" height="8.6" rx="2.4"/></svg>',
gridO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>',
list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><g fill="currentColor" stroke="none"><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></g></svg>',
tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8.5L5 4M12 12.5L19 4M5 4h4.2M5 4v4.2M19 4h-4.2M19 4v4.2"/></svg>',
cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3.5"/><path d="M3 9h18"/><g fill="currentColor" stroke="none"><circle cx="8" cy="13" r="1"/><circle cx="12" cy="13" r="1"/><circle cx="16" cy="13" r="1"/><circle cx="8" cy="17" r="1"/><circle cx="12" cy="17" r="1"/><circle cx="16" cy="17" r="1"/></g></svg>',
calCheck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.5 21H6.5A3.5 3.5 0 0 1 3 17.5v-10A3.5 3.5 0 0 1 6.5 4h11A3.5 3.5 0 0 1 21 7.5V12"/><path d="M3 9h18"/><g fill="currentColor" stroke="none"><circle cx="8" cy="13" r="1"/><circle cx="12" cy="13" r="1"/><circle cx="8" cy="17" r="1"/></g><circle cx="18.5" cy="18.5" r="4.5" fill="currentColor" stroke="none"/><path d="M16.6 18.6l1.4 1.4 2.5-2.6" stroke="#1f1f1f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
chat:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.6 6.2L5 21l4.1-2.3c.9.2 1.9.3 2.9.3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>',
link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4L12 18.4"/></svg>',
send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
clist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l2 2 3-3M4 15l2 2 3-3M13 8h7M13 16h7"/></svg>',
bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
calS:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9.5h18"/><g fill="currentColor" stroke="none"><circle cx="8" cy="14" r="1.3"/><circle cx="12" cy="14" r="1.3"/><circle cx="16" cy="14" r="1.3"/></g></svg>'
};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const md=s=>{const d=parse(s);return `${pad(d.getMonth()+1)}.${pad(d.getDate())}`};
const kdate=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const dotted=s=>{const d=parse(s);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};

function newTask(o={}){const t=today();return Object.assign({id:uid(),title:'',group:GROUPS[0],store:'matrix',type:'todo',checklist:[],quadrant:0,
  parentId:null,color:COLORS[0],repeat:false,repeatType:'weekly',hasDate:true,start:t,end:t,hasTime:false,time:'09:00',remind:'none',done:false,created:Date.now()},o)}
function defSettings(){return {hideDone:false,group:'all',sort:'created',compact:false}}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tasks)){
    s.settings=Object.assign(defSettings(),s.settings);s.chats=s.chats||[];s.notified=s.notified||{};
    s.tasks.forEach(t=>{if(COLORS.indexOf(t.color)<0)t.color=COLORS[0];if(!t.remind)t.remind='none'});return s}}catch(e){}
  const t=today();
  return {tasks:[
    newTask({title:'숙제',quadrant:0,created:1}),
    newTask({title:'운동 계획 세우기',quadrant:1,start:addDays(t,2),end:addDays(t,2),created:2}),
    newTask({title:'택배 반품 신청',quadrant:2,hasDate:false,created:3}),
  ],chats:[],notified:{},settings:defSettings()};
}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now0=new Date();
let ui={tab:'matrix',y:now0.getFullYear(),m:now0.getMonth(),sel:today(),fab:false,chatSel:null,enter:true,pop:null,flash:null,mdir:0,selPop:false,sheetAnim:false};
let draft=null,editingId=null,editorFirst=false;

function occursOn(t,ds){
  if(!t.hasDate)return false;
  if(ds>=t.start&&ds<=t.end)return true;
  if(!t.repeat||ds<t.start)return false;
  const a=parse(t.start),b=parse(ds);
  if(t.repeatType==='daily')return true;
  if(t.repeatType==='weekly')return a.getDay()===b.getDay();
  if(t.repeatType==='monthly')return a.getDate()===b.getDate();
  return false;
}
function visible(list){
  const s=S.settings;
  const r=list.filter(t=>(!s.hideDone||!t.done)&&(s.group==='all'||t.group===s.group));
  const by={created:(a,b)=>a.created-b.created,
    date:(a,b)=>(a.hasDate?a.start+(a.hasTime?a.time:''):'9999').localeCompare(b.hasDate?b.start+(b.hasTime?b.time:''):'9999')||a.created-b.created,
    name:(a,b)=>a.title.localeCompare(b.title,'ko'),
    undone:(a,b)=>(a.done-b.done)||a.created-b.created};
  return r.sort(by[s.sort]||by.created);
}
/* mode: 'fill' colored cell | 'muted' light outline | 'slate' slate fill | 'none' all outline */
function qIcon(q,mode='fill',size=20,sw=1.7){
  const pos=[[0,0],[1,0],[0,1],[1,1]];
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${pos.map(([x,y],i)=>{
    const me=i===q;let fill='none',st='#4a4e52';
    if(me&&mode==='fill'){fill=st=Q[q].color}
    else if(me&&mode==='slate'){fill=st='#5f6d73'}
    else if(me&&mode==='muted'){st='#7d858b'}
    if(mode==='slate'&&!me)st='#5d5d63';if(mode==='none')st='#5d5d63';
    return `<rect x="${1.4+x*11.2}" y="${1.4+y*11.2}" width="${fill==='none'?9.4:10}" height="${fill==='none'?9.4:10}" rx="2.4" fill="${fill}" stroke="${st}" stroke-width="${fill==='none'?sw:0}" ${fill!=='none'?`transform="translate(-.3 -.3)"`:''}/>`}).join('')}</svg>`;
}
const ck=(t,sm)=>`<button class="ck ${sm?'sm':''} ${t.done?'on':''} ${ui.pop===t.id?'pop':''}" data-a="toggle" data-id="${t.id}" aria-label="완료">${I.check}</button>`;
const ttl=t=>`<span class="${t.done?'strike':''} ${t.done&&ui.pop===t.id?'anim':''}">${t.color!==COLORS[0]?`<span class="qdot" style="background:${t.color}"></span>`:''}${esc(t.title)}</span>`;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}

/* ================= screens ================= */
function taskCard(t,i=0){
  const cl=t.checklist.length?`<span class="chip">${I.clist}${t.checklist.filter(c=>c.done).length}/${t.checklist.length}</span>`:'';
  const date=t.hasDate?`<span class="chip">${I.calS}${md(t.start)}${t.end!==t.start?' – '+md(t.end):''}${t.hasTime?' '+t.time:''}</span>`:'';
  const extra=(t.type==='event'?'<span class="chip">일정</span>':'')+(t.repeat?'<span class="chip">반복</span>':'')+(t.remind!=='none'&&t.hasTime?`<span class="chip">${I.bell}</span>`:'');
  return `<div class="tcard st ${ui.flash===t.id?'flash':''}" style="--i:${i}" data-a="open" data-id="${t.id}">
    ${ck(t)}
    <div class="tcm"><div class="ttl">${ttl(t)}</div>${date||cl||extra?`<div class="meta">${date}${cl}${extra}</div>`:''}</div>
    ${qIcon(t.quadrant,t.done?'muted':'fill',21)}
  </div>`;
}

function hdrMain(extra=''){return `<div class="hdr st">
  <div class="pillgrp glass"><button class="ib press" data-a="settings">${I.gear}</button><button class="ib press" data-a="help">${I.help}</button></div>
  <div class="sp"></div>${extra}
  <button class="cbtn glass press" data-a="filter">${I.filter}</button>
  <button class="cbtn glass press" data-a="new">${I.plus}</button></div>`}

function matrix(){
  const ts=visible(S.tasks.filter(t=>t.store==='matrix'));
  const quad=(q,r2)=>{
    const items=ts.filter(t=>t.quadrant===q);
    return `<div class="quad st ${r2?'r2':''}" style="--i:${q+1};--hc:${Q[q].color}" data-a="new" data-q="${q}">
      ${S.settings.compact?`<div class="qhead">${qIcon(q,'fill',15)}<span>${Q[q].name}</span><em>${items.filter(t=>!t.done).length}</em></div>`:''}
      ${items.map(t=>`<div class="qi ${ui.flash===t.id?'flash':''}" data-a="open" data-id="${t.id}">${ck(t,1)}<span class="qt">${ttl(t)}${t.checklist.length?` <small>${t.checklist.filter(c=>c.done).length}/${t.checklist.length}</small>`:''}</span></div>`).join('')}
    </div>`};
  return `${hdrMain(`<button class="cbtn glass press" data-a="layout">${I.layout}</button>`)}
    <div class="mx">
      <div></div><div class="colh st">긴급함</div><div class="colh st">긴급하지않음</div>
      <div class="rowh st">중요함</div>${quad(0)}${quad(1)}
      <div class="rowh r2 st">중요하지않음</div>${quad(2,1)}${quad(3,1)}
    </div>`;
}

function tree(){
  const all=visible(S.tasks);const ids=new Set(all.map(t=>t.id));let n=0;
  const node=(t,d)=>`<div class="tnode">${taskCard(t,n++)}${d<8?all.filter(c=>c.parentId===t.id).map(c=>node(c,d+1)).join(''):''}</div>`;
  const roots=all.filter(t=>!t.parentId||!ids.has(t.parentId));
  return `<div class="hdr st"><button class="cbtn glass press" data-a="settings">${I.gear}</button><div class="sp"></div>
      <button class="cbtn glass press" data-a="filter">${I.filter}</button><button class="cbtn glass press" data-a="new">${I.plus}</button></div>
    ${roots.length?roots.map(t=>node(t,0)).join(''):'<div class="empty st">할 일이 없어요<br>+ 버튼으로 새 할 일을 추가하세요<br>할 일 편집에서 ‘상위 할 일’을 연결하면 트리로 묶여요</div>'}`;
}

function dashboard(){
  const t=today();
  const todays=S.tasks.filter(x=>occursOn(x,t));
  const dn=todays.filter(x=>x.done).length;const pct=todays.length?Math.round(dn/todays.length*100):0;
  const C=2*Math.PI*29;
  const overdue=visible(S.tasks.filter(x=>!x.done&&x.hasDate&&!x.repeat&&x.end<t));
  const upcoming=S.tasks.filter(x=>!x.done&&x.hasDate&&x.start>t&&x.start<=addDays(t,14)).sort((a,b)=>a.start.localeCompare(b.start));
  const nodate=visible(S.tasks.filter(x=>!x.hasDate));
  const d=new Date();let n=3;
  const tiles=Q.map((q,i)=>{const all=S.tasks.filter(x=>x.quadrant===i&&x.store==='matrix');const left=all.filter(x=>!x.done).length;
    const p=all.length?Math.round((all.length-left)/all.length*100):0;

  if(wasEdit){const i=S.tasks.findIndex(t=>t.id===editingId);if(i>=0)S.tasks[i]=draft;else S.tasks.push(draft)}else S.tasks.push(draft);

  ui.flash=draft.id;

/* ================= notifications ================= */
async function ensurePermission(){
  if(!('Notification' in window)){if(isIOS()&&!isStandalone())toast('홈 화면에 추가하면 알림을 받을 수 있어요');return false}
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied'){toast('설정에서 알림이 차단되어 있어요');return false}
  try{const p=await Notification.requestPermission();if(p==='granted'){toast('알림을 켰어요');return true}}catch(e){}
  return false;
}
async function notify(title,body,tag){
  try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(r){await r.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return}}catch(e){}
  try{new Notification(title,{body,tag,icon:'icon-192.png'})}catch(e){}
}
function checkReminders(){
  const can='Notification' in window&&Notification.permission==='granted';
  const nowMs=Date.now();const t0=today();let changed=false;
  for(const t of S.tasks){
    if(t.done||!t.hasDate||!t.hasTime||!t.remind||t.remind==='none')continue;
    const off=+t.remind*60000;
    for(const k of [0,1]){
      const ds=addDays(t0,k);
      if(t.repeat?!occursOn(t,ds):ds!==t.start)continue;
      const at=parse(ds);const[h,mi]=t.time.split(':').map(Number);at.setHours(h,mi,0,0);
      const fire=at.getTime()-off;const key=t.id+'|'+ds+'|'+t.remind+'|'+t.time;
      if(nowMs>=fire&&nowMs-fire<3*3600e3&&!S.notified[key]){
        S.notified[key]=nowMs;changed=true;
        const when=t.remind==='0'?'지금':REMIND.find(r=>r[0]===t.remind)[1].replace(' 전','')+' 뒤';
        const body=`${when} · ${ds===t0?'오늘':kdate(ds)} ${t.time} · ${Q[t.quadrant].name}`;
        if(can)notify(t.title,body,key);
        if(document.visibilityState==='visible')toast(`🔔 ${t.title} — ${when}`);
      }
    }
  }
  for(const k in S.notified)if(nowMs-S.notified[k]>4*864e5){delete S.notified[k];changed=true}
  if(changed)save();
}
setInterval(checkReminders,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkReminders();if(ui.tab==='calendar'||ui.tab==='dashboard')render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ================= actions ================= */
const find=id=>S.tasks.find(t=>t.id===id);
function switchTab(k){
  if(k===ui.tab){const s=$('#app .screen');s&&s.scrollTo({top:0,behavior:'smooth'});return}
  const a=TABS.findIndex(x=>x[0]===ui.tab),b=TABS.findIndex(x=>x[0]===k);
  ui.tab=k;ui.fab=false;ui.chatSel=null;ui.enter=true;
  /* slide the pill before rebuilding so the move is visible */
  const pill=$('.tabpill');if(pill)pill.style.left=`calc(3.5px + ${b} * (100% - 7px) / 5)`;
  render(b>a?1:-1);
}
const A={
  tab:el=>{buzz();switchTab(el.dataset.v)},
  toggle:el=>{const t=find(el.dataset.id);if(!t)return;t.done=!t.done;ui.pop=t.id;buzz();save();render()},
  open:el=>{const t=find(el.dataset.id);if(t)openEditor(t)},
  new:el=>{const p={};if(el.dataset.q!=null)p.quadrant=+el.dataset.q;
    if(el.dataset.d)p.start=p.end=el.dataset.d;
    else if(ui.tab==='calendar')p.start=p.end=ui.sel;
    openEditor(null,p)},
  fab:()=>{ui.fab=!ui.fab;buzz();render()},
  gomatrix:()=>switchTab('matrix'),
  layout:()=>{S.settings.compact=!S.settings.compact;save();render();toast(S.settings.compact?'영역 이름 표시':'영역 이름 숨김')},
  settings:()=>openSheet('settings'),help:()=>openSheet('help'),filter:()=>openSheet('filter'),sort:()=>openSheet('sort'),
  'sheet-close':()=>sheet(''),
  'set-hide':el=>{S.settings.hideDone=!S.settings.hideDone;el.querySelector('.sw')?.classList.toggle('on');save();render()},
  'set-compact':el=>{S.settings.compact=!S.settings.compact;el.querySelector('.sw')?.classList.toggle('on');save();render()},
  'set-group':el=>{S.settings.group=el.dataset.v;save();render();el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
  'set-sort':el=>{S.settings.sort=el.dataset.v;save();el.closest('.panel').querySelectorAll('.rad').forEach(r=>r.classList.remove('on'));el.querySelector('.rad').classList.add('on');setTimeout(()=>{render();sheet('')},220)},
  notif:async()=>{await ensurePermission();openSheet('settings')},
  'notif-test':async()=>{if(await ensurePermission()){notify('매트릭스 투두','알림이 이렇게 표시돼요','test');toast('테스트 알림을 보냈어요')}},
  export:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`matrix-todo-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  'clear-done':()=>{const n=S.tasks.filter(t=>t.done).length;if(!n){toast('완료한 할 일이 없어요');return}
    if(!confirm(`완료한 할 일 ${n}개를 지울까요?`))return;const gone=new Set(S.tasks.filter(t=>t.done).map(t=>t.id));
    S.tasks=S.tasks.filter(t=>!t.done);S.tasks.forEach(t=>{if(gone.has(t.parentId))t.parentId=null});save();render();sheet('');toast('지웠어요')},
  reset:()=>{if(!confirm('모든 할 일과 메모를 삭제할까요? 되돌릴 수 없어요.'))return;S={tasks:[],chats:[],notified:{},settings:defSettings()};save();render();sheet('');toast('초기화했어요')},
  day:el=>{if(ui.sel===el.dataset.d)return;ui.sel=el.dataset.d;ui.selPop=true;ui.sheetAnim=true;const d=parse(ui.sel);
    if(d.getMonth()!==ui.m){ui.mdir=d<new Date(ui.y,ui.m,1)?-1:1;ui.y=d.getFullYear();ui.m=d.getMonth()}buzz();render()},
  'cal-today':()=>{const n=new Date();const dir=(n.getFullYear()*12+n.getMonth())-(ui.y*12+ui.m);ui.mdir=Math.sign(dir);ui.y=n.getFullYear();ui.m=n.getMonth();
    if(ui.sel!==today()){ui.sel=today();ui.selPop=true;ui.sheetAnim=true}render()},
  'chat-send':()=>{const i=$('#chatIn');const v=i.value.trim();if(!v)return;const id=uid();S.chats.push({id,text:v,ts:Date.now()});i.value='';ui.flash=id;save();render();$('#chatIn').focus()},
  msg:el=>{ui.chatSel=ui.chatSel===el.dataset.id?null:el.dataset.id;render()},
  'msg-task':el=>{const c=S.chats.find(x=>x.id===el.dataset.id);ui.chatSel=null;if(c)openEditor(null,{title:c.text.slice(0,200)})},
  'msg-copy':el=>{const c=S.chats.find(x=>x.id===el.dataset.id);ui.chatSel=null;render();if(c&&navigator.clipboard)navigator.clipboard.writeText(c.text).then(()=>toast('복사했어요'),()=>{})},
  'msg-del':el=>{const row=el.closest('.mrow');const id=el.dataset.id;row.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.8)'}],{duration:200,easing:'ease-in'}).onfinish=()=>{S.chats=S.chats.filter(x=>x.id!==id);ui.chatSel=null;save();render()}},
  /* editor */
  'e-close':()=>closeEditor(),
  'e-save':()=>saveDraft(),
  'e-type':el=>segMove(el,()=>{draft.type=el.dataset.v}),
  'e-rep':el=>segMove(el,()=>{draft.repeatType=el.dataset.v}),
  'e-q':el=>{draft.quadrant=+el.dataset.v;buzz();renderEditor()},
  'e-color':el=>{draft.color=el.dataset.v;renderEditor()},
  'e-sw':el=>{const k=el.dataset.v;
    el.classList.toggle('on');const coll=el.closest('.srow').nextElementSibling;if(coll&&coll.classList.contains('coll'))coll.classList.toggle('open');
    setTimeout(()=>{draft[k]=!draft[k];if(k==='hasDate'&&draft.hasDate&&!draft.start)draft.start=draft.end=today();renderEditor()},380)},
  'e-cl':el=>{const c=draft.checklist[+el.dataset.i];c.done=!c.done;renderEditor();const b=$(`#modal [data-a="e-cl"][data-i="${el.dataset.i}"]`);b&&b.classList.add('pop')},
  'e-cl-del':el=>{const row=el.closest('.clrow');row.animate([{opacity:1},{opacity:0,transform:'translateX(20px)'}],{duration:180}).onfinish=()=>{draft.checklist.splice(+el.dataset.i,1);renderEditor()}},
  'e-cl-add':()=>addChecklist(),
  'e-parent':()=>openSheet('parent'),
  'e-unparent':()=>{draft.parentId=null;renderEditor()},
  'pick-parent':el=>{draft.parentId=el.dataset.id;sheet('');renderEditor()},
  'e-del':()=>{if(!confirm('이 할 일을 삭제할까요?'))return;const id=editingId;S.tasks=S.tasks.filter(t=>t.id!==id);
    S.tasks.forEach(t=>{if(t.parentId===id)t.parentId=null});save();closeEditor();render();toast('삭제했어요')}
};
let swallowClick=false;
document.addEventListener('click',e=>{
  if(swallowClick){swallowClick=false;e.preventDefault();e.stopPropagation();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f){if(el.tagName!=='LABEL')e.preventDefault();e.stopPropagation();f(el,e)}
},true);
function onField(e,isChange){
  const el=e.target;const k=el.dataset.in;if(!k)return;const v=el.value;
  if(k==='import'){if(!isChange)return;const file=el.files[0];if(!file)return;file.text().then(txt=>{try{const d=JSON.parse(txt);if(!Array.isArray(d.tasks))throw 0;
      if(!confirm('현재 데이터를 백업 파일로 바꿀까요?'))return;S={tasks:d.tasks,chats:d.chats||[],notified:{},settings:Object.assign(defSettings(),d.settings)};save();render();sheet('');toast('불러왔어요')}catch(_){toast('올바른 백업 파일이 아니에요')}});return}
  if(!draft)return;
  if(k==='title'){draft.title=v;$('.savebtn')?.classList.toggle('ok',!!v.trim());return}
  if(k==='group'||k==='store'){draft[k]=v;return}
  if(k==='remind'){draft.remind=v;if(isChange&&v!=='none')ensurePermission();return}
  if(k==='time'){if(v)draft.time=v;if(isChange)renderEditor();return}
  if(k==='start'||k==='end'){
    if(!v||!isChange)return;
    if(k==='start'){draft.hasDate=true;const span=Math.round((parse(draft.end)-parse(draft.start))/864e5);draft.start=v;draft.end=addDays(v,Math.max(0,span||0))}
    else{draft.end=v;if(v<draft.start)draft.start=v}
    renderEditor();
  }
}
document.addEventListener('input',e=>onField(e,false));
document.addEventListener('change',e=>onField(e,true));
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing){
    if(e.target.id==='chatIn'){e.preventDefault();A['chat-send']()}
    else if(e.target.id==='clIn'){e.preventDefault();addChecklist()}
    else if(e.target.dataset?.in==='title'){e.preventDefault();e.target.blur()}
  }
  if(e.key==='Escape'){if($('#sheet').innerHTML)sheet('');else if(draft)closeEditor();else if(ui.fab){ui.fab=false;render()}}
  if(ui.tab==='calendar'&&!draft&&!$('#sheet').innerHTML&&document.activeElement===document.body){
    if(e.key==='ArrowLeft')moveMonth(-1);if(e.key==='ArrowRight')moveMonth(1);
  }
});
function moveMonth(n){const d=new Date(ui.y,ui.m+n,1);ui.y=d.getFullYear();ui.m=d.getMonth();ui.mdir=n;
  const s=parse(ui.sel);if(s.getMonth()!==ui.m||s.getFullYear()!==ui.y){ui.sel=ymd(new Date(ui.y,ui.m,1));if(today().slice(0,7)===ui.sel.slice(0,7))ui.sel=today();ui.sheetAnim=true}
  buzz();render()}

/* ---- calendar swipe ---- */
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(e.target.closest('#cgrid')){tx=e.touches[0].clientX;ty=e.touches[0].clientY}else tx=null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){swallowClick=true;setTimeout(()=>swallowClick=false,350);moveMonth(dx<0?1:-1)}},{passive:true});
document.addEventListener('wheel',e=>{if(!e.target.closest('#cgrid'))return;const dlt=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(dlt)<25)return;
  if(moveMonth.lock)return;moveMonth.lock=true;setTimeout(()=>moveMonth.lock=false,450);moveMonth(dlt>0?1:-1)},{passive:true});

/* ---- long-press drag between quadrants ---- */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const it=e.target.closest('.qi');if(!it||e.target.closest('.ck'))return;
  const st={id:it.dataset.id,x:e.clientX,y:e.clientY,el:it};
  st.timer=setTimeout(()=>startDrag(st),380);drag=st;
});
function startDrag(st){
  const r=st.el.getBoundingClientRect();const g=document.createElement('div');g.className='ghost';
  g.innerHTML=st.el.innerHTML;g.style.width=r.width+'px';st.ox=st.x-r.left;st.oy=st.y-r.top;
  g.style.transform=`translate(${r.left}px,${r.top}px) scale(1.06)`;document.body.appendChild(g);
  st.ghost=g;st.active=true;st.el.classList.add('dragging');buzz();
}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){clearTimeout(drag.timer);drag=null}return}
  drag.ghost.style.transform=`translate(${e.clientX-drag.ox}px,${e.clientY-drag.oy}px) scale(1.06)`;
  const q=document.elementFromPoint(e.clientX,e.clientY)?.closest('.quad');
  document.querySelectorAll('.quad.hot').forEach(x=>x!==q&&x.classList.remove('hot'));
  if(q&&!q.classList.contains('hot')){q.classList.add('hot');buzz()}
});
function endDrag(e,cancel){
  if(!drag)return;clearTimeout(drag.timer);
  if(drag.active){
    const q=!cancel&&document.elementFromPoint(e.clientX,e.clientY)?.closest('.quad');
    drag.ghost.remove();document.querySelectorAll('.quad.hot').forEach(x=>x.classList.remove('hot'));drag.el.classList.remove('dragging');
    swallowClick=true;setTimeout(()=>swallowClick=false,350);
    const t=find(drag.id);
    if(q&&t&&+q.dataset.q!==t.quadrant){t.quadrant=+q.dataset.q;ui.flash=t.id;save();render();toast(`‘${Q[t.quadrant].name}’ 영역으로 옮겼어요`)}
  }
  drag=null;
}
document.addEventListener('pointerup',e=>endDrag(e));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.qi'))e.preventDefault()});

render();
setTimeout(checkReminders,1500);
</script>
