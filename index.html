<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>매트릭스 투두</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#f2f2f4;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
#app{position:relative;max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;min-height:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 130px}
.screen::-webkit-scrollbar{display:none}

/* header */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:50px}
.hdr .sp{flex:1}
.cbtn{width:50px;height:50px;flex:none;border-radius:50%;background:#262628;display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.05)}
.cbtn svg{width:25px;height:25px}
.cbtn:active,.tab:active,.fab:active{transform:scale(.94)}
.pillgrp{height:50px;border-radius:25px;background:#262628;display:flex;align-items:center;padding:0 8px;gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.05)}
.pillgrp .cbtn{background:none;box-shadow:none;width:40px;height:40px}
.badge{min-width:30px;height:30px;padding:0 6px;border:1.5px solid #5a5a5e;border-radius:9px;display:grid;place-items:center;font-size:15px;font-weight:600}
.htitle{flex:1;text-align:center;font-size:21px;font-weight:700;color:#d6d6da;letter-spacing:-.3px}

/* cards */
.card{background:linear-gradient(180deg,#232326,#19191b);border:1px solid rgba(255,255,255,.09);border-radius:24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ck{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid #5b636b;display:grid;place-items:center;color:transparent}
.ck svg{width:18px;height:18px}
.ck.on{background:#5b636b;color:#fff;border-color:#6d767e}
.ck.sm{width:22px;height:22px;border-radius:6px}
.ck.sm svg{width:15px;height:15px}
.done .ttl,.qi.done .qt{color:#6a6a6f;text-decoration:line-through;text-decoration-thickness:2px}

/* tab bar */
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:68px;border-radius:34px;
  background:rgba(32,32,34,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;padding:5px;
  border:1px solid rgba(255,255,255,.08);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:29px;font-size:11.5px;color:#e6e6e8;white-space:nowrap}
.tab svg{width:25px;height:25px}
.tab.on{background:#09090b;color:#3d8bfd}

/* floating buttons */
.fab{position:absolute;z-index:19;display:grid;place-items:center;border-radius:50%;background:#262628;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.05),0 6px 20px rgba(0,0,0,.5)}
.fab-l{left:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:52px;height:52px}
.fab-l svg{width:26px;height:26px}
.fab-r{right:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:56px;height:56px}
.fab-r svg{width:26px;height:26px}
.dial{position:absolute;right:16px;z-index:19;display:flex;flex-direction:column;gap:12px;bottom:calc(env(safe-area-inset-bottom) + 160px)}
.dial button{width:62px;height:62px;border-radius:20px;background:rgba(40,40,43,.95);display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.06),0 8px 22px rgba(0,0,0,.6);animation:pop .22s backwards}
.dial button:nth-child(2){animation-delay:.03s}.dial button:nth-child(3){animation-delay:.06s}.dial button:nth-child(4){animation-delay:.09s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.8)}}
.dimmer{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:18;animation:fade .2s}
@keyframes fade{from{opacity:0}}

/* matrix */
.screen.matrix{display:flex;flex-direction:column;overflow:hidden}
.mx{flex:1;min-height:0;display:grid;grid-template-columns:22px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:12px 12px}
.colh{text-align:center;font-weight:700;font-size:16px;color:#e9e9eb}
.rowh{writing-mode:vertical-rl;text-orientation:sideways;transform:rotate(180deg);text-align:center;font-weight:700;font-size:16px;color:#e9e9eb;align-self:center}
.quad{min-height:0;overflow-y:auto;padding:14px 14px;border-radius:24px;background:linear-gradient(180deg,#232325,#1a1a1c);
  border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.quad::-webkit-scrollbar{display:none}
.qhead{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#bdbdc2;margin-bottom:8px}
.qhead em{font-style:normal;margin-left:auto;color:#77777c;font-weight:600}
.qi{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:15px;line-height:22px;cursor:pointer}
.qt{flex:1;min-width:0;word-break:break-all}
.qt small{color:#77777c;font-size:12px}
.qdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 4px 2px 0;vertical-align:middle}

/* tree / list cards */
.tcard{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 22px;margin-bottom:10px;cursor:pointer}
.tcard .ck{margin-left:6px}
.tcm{flex:1;min-width:0}
.ttl{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:#2e2e31;color:#a3a3a8;font-size:13px;padding:3px 8px;border-radius:7px}
.chip svg{width:13px;height:13px}
.tnode .tnode{margin-left:24px;position:relative}
.tnode .tnode::before{content:"";position:absolute;left:-14px;top:-10px;height:46px;width:12px;border-left:2px solid #3a3a3e;border-bottom:2px solid #3a3a3e;border-bottom-left-radius:10px}
.empty{color:#6c6c71;text-align:center;padding:60px 20px;font-size:15px;line-height:1.6}
.sect{font-size:14px;font-weight:700;color:#8e8e93;margin:22px 4px 10px}

/* dashboard */
.hero{display:flex;align-items:center;gap:18px;padding:20px 22px;margin-bottom:12px}
.hero h2{font-size:20px;font-weight:700;margin-bottom:4px}
.hero p{color:#9a9a9f;font-size:14px}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtile{padding:16px;cursor:pointer}
.qtile .top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.qtile .lbl{color:#8a8a8f;font-size:12px;margin:6px 0 10px}
.qtile .num{font-size:24px;font-weight:700}
.qtile .num small{font-size:13px;color:#8a8a8f;font-weight:500}
.bar{height:5px;border-radius:3px;background:#333336;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}

/* calendar */
.screen.calendar{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:15px;color:#a9a9ae;margin:4px 0 8px}
.wk .sun{color:#f0524f}.wk .sat{color:#3d8bfd}
.cgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:4px 3px;touch-action:pan-y}
.cell{border-radius:16px;padding-top:6px;text-align:center;font-size:16px;font-weight:500;cursor:pointer;overflow:hidden;border:1.5px solid transparent;min-height:0}
.cell.sun{color:#f0524f}.cell.sat{color:#e8e8ea}
.cell.out{color:#4b4b4f}
.cell.sel{background:#232325}
.cell.today{border-color:#1f4f8f;background:#050d18;color:#3d8bfd}
.cell .bars{display:flex;flex-direction:column;gap:3px;padding:6px 7px 0}
.cell .bars i{height:4px;border-radius:2px;display:block}
.cell .more{font-size:10px;color:#77777c;margin-top:2px}
.daysheet{margin:10px -18px 0;background:#1c1c1e;border-radius:28px 28px 0 0;border-top:1px solid rgba(255,255,255,.08);
  padding:16px 18px calc(env(safe-area-inset-bottom) + 92px);max-height:42%;display:flex;flex-direction:column}
.daysheet .grab{width:38px;height:5px;border-radius:3px;background:#3a3a3d;margin:0 auto 12px}
.daysheet .dlist{overflow-y:auto;flex:1;min-height:0}
.daysheet h3{font-size:20px;font-weight:700;text-align:center;color:#d8d8dc}
.daysheet .sub{text-align:center;color:#6f6f74;font-size:16px;line-height:1.55;margin-top:8px}
.drow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #2a2a2d;cursor:pointer}
.drow:last-child{border:0}
.drow .ttl{font-size:16px;flex:1}
.drow .tm{color:#8e8e93;font-size:13px}
.evdot{width:12px;height:12px;border-radius:4px;margin:0 8px;flex:none}
.dacts{display:flex;align-items:center;gap:12px;margin-top:14px}
.dacts .cbtn{width:52px;height:52px;background:#2a2a2d}
.addpill{margin-left:auto;height:52px;border-radius:26px;background:#2a2a2d;padding:0 18px 0 22px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.06)}
.addpill svg{width:22px;height:22px}

/* chat */
.screen.chat{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px 10px}
.dsep{align-self:center;color:#77777c;font-size:12px;background:#1a1a1c;padding:4px 12px;border-radius:12px;margin:10px 0 4px}
.mrow{display:flex;flex-direction:column;align-items:flex-end}
.bub{background:#2f6fe4;color:#fff;padding:10px 14px;border-radius:20px 20px 6px 20px;max-width:78%;font-size:16px;line-height:1.4;word-break:break-word;white-space:pre-wrap;cursor:pointer}
.mtime{font-size:11px;color:#66666b;margin:3px 4px 0}
.macts{display:flex;gap:6px;margin-top:6px}
.macts button{background:#2a2a2d;border-radius:14px;padding:6px 12px;font-size:13px}
.macts .del{color:#ff6b6b}
.cin{display:flex;gap:8px;align-items:center;padding:8px 0 calc(env(safe-area-inset-bottom) + 92px)}
.cin input{flex:1;height:46px;border-radius:23px;border:1px solid #333336;background:#1c1c1e;padding:0 18px;outline:none;font-size:16px}
.send{width:46px;height:46px;border-radius:50%;background:#3d8bfd;display:grid;place-items:center;color:#fff}
.send svg{width:22px;height:22px}

/* editor */
#modal .mwrap{position:fixed;inset:0;z-index:50;background:#141417;display:flex;flex-direction:column;max-width:440px;margin:0 auto}
#modal .mwrap.anim{animation:up .3s cubic-bezier(.2,.8,.2,1)}
#modal .mwrap.closing{animation:down .22s forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  background:linear-gradient(#141417 70%,rgba(20,20,23,0));position:relative;z-index:2}
.mtop .cbtn{background:#2a2a2d}
.mtop .cbtn.xb svg{width:30px;height:30px;color:#2a2a2d}
.xcirc{width:28px;height:28px;border-radius:50%;background:#8e8e93;display:grid;place-items:center;color:#2a2a2d}
.xcirc svg{width:16px;height:16px}
.savebtn .sc{width:30px;height:30px;border-radius:50%;background:#636366;display:grid;place-items:center;color:#2a2a2d;transition:.2s}
.savebtn .sc svg{width:18px;height:18px}
.savebtn.ok .sc{background:#3d9bff;color:#123}
.datepill{position:relative;height:46px;border-radius:23px;background:#2c2c30;display:flex;align-items:center;gap:8px;padding:0 18px 0 24px;font-size:20px;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.06)}
.datepill svg{width:22px;height:22px}
.datepill input,.dchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.mbody{flex:1;overflow-y:auto;padding:4px 20px 60px}
.sec{background:#26262a;border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:20px 20px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.sec h4{font-size:16.5px;font-weight:700;color:#e2e2e4}
.hr{height:1px;background:#3a3a3e;margin:16px 0}
.tin{width:100%;margin-top:16px;background:transparent;border:2px solid #4a4a4f;border-radius:18px;padding:15px 18px;font-size:17px;outline:none}
.tin:focus{border-color:#6a6a70}
.sel{position:relative;display:flex;align-items:center;gap:4px;color:#8e8e93;font-size:16px}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:none;color:inherit;font-size:16px;text-align:right;padding-right:2px;cursor:pointer}
.sel select option{background:#2a2a2d;color:#fff}
.sel svg{width:18px;height:18px}
.sel .ic{width:22px;height:22px}
.seg{display:flex;background:#1c1c1f;border-radius:20px;padding:3px;width:184px}
.seg button{flex:1;height:36px;border-radius:17px;color:#ddd;font-size:16px}
.seg .on{background:#5d6066;color:#fff}
.clrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.clrow span{flex:1;font-size:16px}
.clrow.done span{color:#6a6a6f;text-decoration:line-through}
.clrow .rm{color:#77777c;width:28px;height:28px;display:grid;place-items:center}
.clrow .rm svg{width:16px;height:16px}
.cladd{display:flex;align-items:center;gap:10px;margin-top:10px}
.cladd input{flex:1;background:transparent;border:0;outline:none;font-size:16px;font-weight:600}
.cladd input::placeholder{color:#6c6c71}
.cladd button{width:66px;height:44px;border-radius:22px;background:#3a3d40;display:grid;place-items:center;color:#7d8287;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.cladd button svg{width:24px;height:24px}
.qopts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.qopt{background:#3a3a3f;border-radius:18px;padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px;color:#a8a8ad;border:1.5px solid transparent}
.qopt.on{background:#46464c;color:#fff}
.qlabel{color:#8e8e93;font-size:14px}
.plink{margin-top:16px;border:2px dashed #4a4a4f;border-radius:16px;height:60px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;color:#8e8e93;font-size:16px}
.plink svg{width:22px;height:22px}
.pcard{margin-top:14px;display:flex;align-items:center;gap:10px;background:#1e1e21;border-radius:16px;padding:12px 14px}
.pcard span{flex:1;font-size:16px}
.colors{display:flex;justify-content:space-between;margin-top:18px}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative}
.dot svg{width:18px;height:18px}
.dot.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #55595e}
.sw{width:68px;height:36px;border-radius:18px;background:#5a5a5f;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:42px;height:30px;border-radius:15px;background:#fff;transition:.2s}
.sw.on{background:#5d676f}
.sw.on::after{left:23px}
.dchip{position:relative;background:#3c3c41;border-radius:22px;padding:9px 18px;font-size:18px}
.delbtn{width:100%;height:54px;border-radius:20px;background:#2a1a1c;color:#ff6b6b;font-size:17px;font-weight:600;margin-top:4px}

/* sheets */
#sheet .bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;animation:fade .2s}
#sheet .panel{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;z-index:61;background:#1f1f22;border-radius:28px 28px 0 0;
  padding:12px 20px calc(env(safe-area-inset-bottom) + 24px);max-height:80%;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.2,1);border-top:1px solid rgba(255,255,255,.08)}
.panel .grab{width:38px;height:5px;border-radius:3px;background:#3a3a3d;margin:0 auto 14px}
.panel h3{font-size:19px;font-weight:700;margin-bottom:14px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid #2c2c30;font-size:16px;cursor:pointer;width:100%;text-align:left}
.prow:last-child{border:0}
.prow .r{color:#8e8e93;font-size:14px}
.prow.red{color:#ff6b6b}
.prow .rad{width:22px;height:22px;border-radius:50%;border:2px solid #55555a;flex:none}
.prow .rad.on{border:7px solid #3d8bfd}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{padding:8px 14px;border-radius:16px;background:#2c2c30;font-size:15px}
.chips .on{background:#3d8bfd;color:#fff}
.help p{color:#a8a8ad;font-size:15px;line-height:1.6;margin-bottom:12px}
.hq{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.hq b{display:block;font-size:16px;margin-bottom:2px}
.hq span{color:#8e8e93;font-size:14px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 18px);transform:translate(-50%,-20px);opacity:0;background:rgba(50,50,54,.96);
  color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- constants ---------- */
const Q=[
  {name:'실행',label:'중요함-긴급함',color:'#e5484d',desc:'지금 바로 처리할 일'},
  {name:'계획',label:'중요함-긴급하지않음',color:'#3d8bfd',desc:'일정을 잡아 꾸준히 할 일'},
  {name:'위임',label:'중요하지않음-긴급함',color:'#ee9a4d',desc:'빠르게 끝내거나 맡길 일'},
  {name:'제거',label:'중요하지않음-긴급하지않음',color:'#a1a1a6',desc:'줄이거나 하지 않아도 되는 일'}
];
const COLORS=['#5f6a72','#c4a98a','#9e6247','#f0dcc0','#8f817a','#1c4870','#d6264f','#5b63f5'];
const GROUPS=['기본 그룹','업무','개인','공부'];
const WD=['일','월','화','수','목','금','토'];
const KEY='matrix-todo-v1';

const I={
gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="3.6" stroke-dasharray="3.3 3.3"/><circle cx="12" cy="12" r="6.4" fill="currentColor"/><circle cx="12" cy="12" r="2.7" fill="#262628"/></svg>',

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const md=s=>{const d=parse(s);return `${pad(d.getMonth()+1)}.${pad(d.getDate())}`};
const kdate=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const dotted=s=>{const d=parse(s);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};

function newTask(o={}){const t=today();return Object.assign({id:uid(),title:'',group:GROUPS[0],store:'matrix',type:'todo',checklist:[],quadrant:0,
  parentId:null,color:COLORS[0],repeat:false,repeatType:'weekly',hasDate:true,start:t,end:t,hasTime:false,time:'09:00',done:false,created:Date.now()},o)}

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tasks)){s.settings=Object.assign(defSettings(),s.settings);s.chats=s.chats||[];return s}}catch(e){}
  const t=today();
  return {tasks:[
    newTask({title:'숙제',quadrant:0,created:1}),
    newTask({title:'운동 계획 세우기',quadrant:1,start:addDays(t,2),end:addDays(t,2),color:COLORS[7],created:2}),
    newTask({title:'택배 반품 신청',quadrant:2,hasDate:false,created:3}),
  ],chats:[],settings:defSettings()};
}
function defSettings(){return {hideDone:false,group:'all',sort:'created',compact:false}}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=new Date();
let ui={tab:'matrix',y:now.getFullYear(),m:now.getMonth(),sel:today(),fab:false,chatSel:null};
let draft=null,editingId=null;

function occursOn(t,ds){
  if(!t.hasDate)return false;
  if(ds>=t.start&&ds<=t.end)return true;
  if(!t.repeat||ds<t.start)return false;
  const a=parse(t.start),b=parse(ds);
  if(t.repeatType==='daily')return true;
  if(t.repeatType==='weekly')return a.getDay()===b.getDay();
  if(t.repeatType==='monthly')return a.getDate()===b.getDate();
  return false;
}
function visible(list){
  const s=S.settings;
  const r=list.filter(t=>(!s.hideDone||!t.done)&&(s.group==='all'||t.group===s.group));
  const by={created:(a,b)=>a.created-b.created,
    date:(a,b)=>(a.hasDate?a.start:'9999').localeCompare(b.hasDate?b.start:'9999')||a.created-b.created,
    name:(a,b)=>a.title.localeCompare(b.title,'ko'),
    undone:(a,b)=>(a.done-b.done)||a.created-b.created};
  return r.sort(by[s.sort]||by.created);
}
function qIcon(q,active=true,size=26){
  const pos=[[0,0],[1,0],[0,1],[1,1]];
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${pos.map(([x,y],i)=>{
    const me=i===q;const st=me?(active?Q[q].color:'#9aa0a6'):'#4c5054';
    return `<rect x="${1.5+x*11}" y="${1.5+y*11}" width="9.5" height="9.5" rx="2.4" fill="${me&&active?Q[q].color:'none'}" stroke="${st}" stroke-width="1.7"/>`}).join('')}</svg>`;
}
const ck=(t,sm)=>`<button class="ck ${sm?'sm':''} ${t.done?'on':''}" data-a="toggle" data-id="${t.id}" aria-label="완료">${I.check}</button>`;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}

/* ---------- screens ---------- */
function taskCard(t){
  const cl=t.checklist.length?`<span class="chip">${I.clist} ${t.checklist.filter(c=>c.done).length}/${t.checklist.length}</span>`:'';
  const date=t.hasDate?`<span class="chip">${I.cal} ${md(t.start)}${t.end!==t.start?' – '+md(t.end):''}${t.hasTime?' '+t.time:''}</span>`:'';
  return `<div class="tcard card ${t.done?'done':''}" data-a="open" data-id="${t.id}">
    ${ck(t)}
    <div class="tcm"><div class="ttl">${t.color!==COLORS[0]?`<span class="qdot" style="background:${t.color}"></span>`:''}${esc(t.title)}</div>
    ${date||cl||t.type==='event'?`<div class="meta">${date}${cl}${t.type==='event'?'<span class="chip">일정</span>':''}${t.repeat?'<span class="chip">반복</span>':''}</div>`:''}</div>
    ${qIcon(t.quadrant,!t.done,34)}
  </div>`;
}

function matrix(){
  const ts=visible(S.tasks.filter(t=>t.store==='matrix'));
  const quad=q=>{
    const items=ts.filter(t=>t.quadrant===q);
    return `<div class="quad" data-a="new" data-q="${q}">
      ${S.settings.compact?`<div class="qhead">${qIcon(q,true,18)}<span>${Q[q].name}</span><em>${items.filter(t=>!t.done).length}</em></div>`:''}
      ${items.map(t=>`<div class="qi ${t.done?'done':''}" data-a="open" data-id="${t.id}">${ck(t,1)}<span class="qt">${t.color!==COLORS[0]?`<span class="qdot" style="background:${t.color}"></span>`:''}${esc(t.title)}${t.checklist.length?` <small>${t.checklist.filter(c=>c.done).length}/${t.checklist.length}</small>`:''}</span></div>`).join('')}
    </div>`};
  return `<div class="hdr">
      <div class="pillgrp"><button class="cbtn" data-a="settings">${I.gear}</button><button class="cbtn" data-a="help">${I.help}</button></div>
      <div class="sp"></div>
      <button class="cbtn" data-a="layout">${I.layout}</button>
      <button class="cbtn" data-a="filter">${I.filter}</button>
      <button class="cbtn" data-a="new">${I.plus}</button>
    </div>
    <div class="mx">
      <div></div><div class="colh">긴급함</div><div class="colh">긴급하지않음</div>
      <div class="rowh">중요함</div>${quad(0)}${quad(1)}
      <div class="rowh">중요하지않음</div>${quad(2)}${quad(3)}
    </div>`;
}

function tree(){
  const all=visible(S.tasks);const ids=new Set(all.map(t=>t.id));
  const node=(t,d)=>`<div class="tnode">${taskCard(t)}${d<8?all.filter(c=>c.parentId===t.id).map(c=>node(c,d+1)).join(''):''}</div>`;
  const roots=all.filter(t=>!t.parentId||!ids.has(t.parentId));
  return `<div class="hdr"><button class="cbtn" data-a="settings">${I.gear}</button><div class="sp"></div>
      <button class="cbtn" data-a="filter">${I.filter}</button><button class="cbtn" data-a="new">${I.plus}</button></div>
    ${roots.length?roots.map(t=>node(t,0)).join(''):'<div class="empty">할 일이 없어요<br>+ 버튼으로 새 할 일을 추가하세요<br>할 일 편집에서 ‘상위 할 일’을 연결하면 트리로 묶여요</div>'}`;
}

function dashboard(){
  const t=today();
  const todays=S.tasks.filter(x=>occursOn(x,t));
  const dn=todays.filter(x=>x.done).length;const pct=todays.length?Math.round(dn/todays.length*100):0;
  const C=2*Math.PI*31;
  const overdue=visible(S.tasks.filter(x=>!x.done&&x.hasDate&&!x.repeat&&x.end<t));
  const upcoming=S.tasks.filter(x=>!x.done&&x.hasDate&&x.start>t&&x.start<=addDays(t,14)).sort((a,b)=>a.start.localeCompare(b.start));
  const nodate=visible(S.tasks.filter(x=>!x.hasDate));
  const d=new Date();
  const tiles=Q.map((q,i)=>{const all=S.tasks.filter(x=>x.quadrant===i&&x.store==='matrix');const left=all.filter(x=>!x.done).length;
    const p=all.length?Math.round((all.length-left)/all.length*100):0;
    return `<div class="qtile card" data-a="gomatrix"><div class="top">${qIcon(i,true,20)}${q.name}</div><div class="lbl">${q.label}</div>
      <div class="num">${left}<small> / ${all.length} 남음</small></div><div class="bar"><i style="width:${p}%;background:${q.color}"></i></div></div>`}).join('');
  const sec=(title,list)=>list.length?`<div class="sect">${title}</div>${list.map(taskCard).join('')}`:'';
  return `<div class="hdr"><button class="cbtn" data-a="settings">${I.gear}</button><div class="htitle">대시보드</div>
      <button class="cbtn" data-a="new">${I.plus}</button></div>
    <div class="hero card">
      <div class="ring"><svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="31" fill="none" stroke="#333336" stroke-width="8"/>
        <circle cx="37" cy="37" r="31" fill="none" stroke="#3d8bfd" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 37 37)"/></svg><b>${pct}%</b></div>
      <div><h2>${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일</h2>
      <p>${todays.length?`오늘 할 일 ${todays.length}개 중 ${dn}개 완료`:'오늘은 여유로운 날이에요'}</p></div>
    </div>
    <div class="qgrid">${tiles}</div>
    ${sec('오늘',visible(todays))}${sec('기한 지남',overdue)}${sec('다가오는 2주',upcoming)}${sec('날짜 없음',nodate)}`;
}

function calendar(){
  const {y,m}=ui;const first=new Date(y,m,1);const t=today();
  const cells=[];for(let i=0;i<42;i++){cells.push(new Date(y,m,1-first.getDay()+i))}
  const pool=visible(S.tasks);
  const grid=cells.map(d=>{
    const ds=ymd(d);const list=pool.filter(x=>occursOn(x,ds));const dow=d.getDay();
    const cls=['cell',d.getMonth()!==m?'out':'',dow===0?'sun':'',dow===6?'sat':'',ds===t?'today':'',ds===ui.sel&&ds!==t?'sel':''].join(' ');
    return `<div class="${cls}" data-a="day" data-d="${ds}">${d.getDate()}<div class="bars">${list.slice(0,3).map(x=>`<i style="background:${x.color};opacity:${x.done?.4:1}"></i>`).join('')}${list.length>3?`<div class="more">+${list.length-3}</div>`:''}</div></div>`;
  }).join('');
  const dayList=visible(S.tasks.filter(x=>occursOn(x,ui.sel)));
  const sd=parse(ui.sel);
  const body=dayList.length?`<div class="dlist">${dayList.map(x=>`<div class="drow ${x.done?'done':''}" data-a="open" data-id="${x.id}">
      ${x.type==='event'?`<span class="evdot" style="background:${x.color}"></span>`:ck(x)}
      <span class="ttl">${esc(x.title)}</span>${x.hasTime?`<span class="tm">${x.time}</span>`:''}${qIcon(x.quadrant,!x.done,24)}</div>`).join('')}</div>`
    :`<h3>${ui.sel===t?'오늘은':kdate(ui.sel)+'은'} 여유로운 날이에요</h3><p class="sub">편안한 휴식을 취하거나<br>새로운 계획을 세워보세요</p>`;
  return `<div class="hdr"><div class="pillgrp"><button class="cbtn" data-a="settings">${I.gear}</button><button class="badge" data-a="cal-today">${new Date().getDate()}</button></div>
      <div class="htitle" data-a="cal-today">${y}년 ${m+1}월</div>
      <button class="cbtn" data-a="filter">${I.filter}</button><button class="cbtn" data-a="new" data-d="${ui.sel}">${I.plus}</button></div>
    <div class="wk">${WD.map((w,i)=>`<div class="${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}</div>
    <div class="cgrid" id="cgrid">${grid}</div>
    <div class="daysheet"><div class="grab"></div>${body}
      <div class="dacts"><button class="cbtn" data-a="sort">${I.menu}</button><button class="cbtn" data-a="cal-today">${I.calCheck}</button>
      <button class="addpill" data-a="new" data-d="${ui.sel}" data-ev="1">${sd.getMonth()+1}월 ${sd.getDate()}일에 일정 추가 ${I.plus}</button></div>
    </div>`;
}

function chat(){
  let last='';
  const msgs=S.chats.map(c=>{
    const d=new Date(c.ts);const ds=ymd(d);let sep='';
    if(ds!==last){last=ds;sep=`<div class="dsep">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일</div>`}
    return `${sep}<div class="mrow"><div class="bub" data-a="msg" data-id="${c.id}">${esc(c.text)}</div>
      ${ui.chatSel===c.id?`<div class="macts"><button data-a="msg-task" data-id="${c.id}">할 일로 추가</button><button data-a="msg-copy" data-id="${c.id}">복사</button><button class="del" data-a="msg-del" data-id="${c.id}">삭제</button></div>`
      :`<div class="mtime">${pad(d.getHours())}:${pad(d.getMinutes())}</div>`}</div>`;
  }).join('');
  return `<div class="hdr"><button class="cbtn" data-a="settings">${I.gear}</button><div class="htitle">나와의 채팅</div><div style="width:50px"></div></div>
    <div class="msgs" id="msgs">${msgs||'<div class="empty">나에게 메모를 남겨보세요<br>말풍선을 누르면 할 일로 바꿀 수 있어요</div>'}</div>
    <div class="cin"><input id="chatIn" placeholder="메모 입력" enterkeyhint="send" autocomplete="off"><button class="send" data-a="chat-send">${I.send}</button></div>`;
}

const SCREENS={matrix,dashboard,tree,calendar,chat};
const TABS=[['matrix','Matrix',I.grid],['dashboard','대시보드',I.list],['tree','트리',I.tree],['calendar','캘린더',I.cal],['chat','나와의채팅',I.chat]];

function render(){
  const keepChat=$('#chatIn')?.value||'';
  const showFab=ui.tab==='matrix'||ui.tab==='tree'||ui.tab==='dashboard';
  $('#app').innerHTML=`<div class="screen ${ui.tab}">${SCREENS[ui.tab]()}</div>
    ${showFab&&ui.fab?'<div class="dimmer" data-a="fab"></div>':''}
    ${showFab?`<button class="fab fab-l" data-a="sort">${I.menu}</button><button class="fab fab-r" data-a="fab">${ui.fab?I.x:I.grid}</button>`:''}
    ${showFab&&ui.fab?`<div class="dial">${[0,1,2,3].map(q=>`<button data-a="new" data-q="${q}" title="${Q[q].name}">${qIcon(q,true,36)}</button>`).join('')}</div>`:''}
    <nav class="tabbar">${TABS.map(([k,l,ic])=>`<button class="tab ${ui.tab===k?'on':''}" data-a="tab" data-v="${k}">${ic}<span>${l}</span></button>`).join('')}</nav>`;
  if(ui.tab==='chat'){const m=$('#msgs');m.scrollTop=m.scrollHeight;const ci=$('#chatIn');ci.value=keepChat}
}

/* ---------- editor ---------- */
function openEditor(t,preset={}){
  editingId=t?t.id:null;
  draft=JSON.parse(JSON.stringify(t||newTask(preset)));
  ui.fab=false;render();renderEditor(true);
}
function closeEditor(){
  const w=$('#modal .mwrap');draft=null;editingId=null;
  if(w){w.classList.add('closing');setTimeout(()=>{if(!draft)$('#modal').innerHTML=''},210)}
}
function renderEditor(first){
  const m=$('#modal');if(!draft){m.innerHTML='';return}
  const sc=m.querySelector('.mbody')?.scrollTop||0;
  const d=draft;const ds=d.hasDate?d.start:today();
  const parent=d.parentId&&S.tasks.find(t=>t.id===d.parentId);
  m.innerHTML=`<div class="mwrap ${first?'anim':''}">
  <div class="mtop">
    <button class="cbtn" data-a="e-close"><span class="xcirc">${I.x}</span></button>
    <label class="datepill">${kdate(ds)} ${I.chev}<input type="date" data-in="start" value="${ds}"></label>
    <button class="cbtn savebtn ${d.title.trim()?'ok':''}" data-a="e-save"><span class="sc">${I.check}</span></button>
  </div>
  <div class="mbody">
    <div class="sec"><div class="srow"><h4>할 일 내용</h4>
      <label class="sel"><select data-in="group">${GROUPS.map(g=>`<option ${g===d.group?'selected':''}>${g}</option>`).join('')}</select>${I.updown}</label></div>
      <input class="tin" data-in="title" placeholder="무엇을 해야 하나요?" value="${esc(d.title)}" maxlength="200" enterkeyhint="done"></div>

    <div class="sec"><div class="srow"><h4>저장 위치</h4>
      <label class="sel"><span class="ic">${I.gridO}</span><select data-in="store"><option value="matrix" ${d.store==='matrix'?'selected':''}>매트릭스</option><option value="calendar" ${d.store==='calendar'?'selected':''}>캘린더만</option></select>${I.updown}</label></div>
      <div class="hr"></div>
      <div class="srow"><h4>구분</h4><div class="seg"><button class="${d.type==='todo'?'on':''}" data-a="e-type" data-v="todo">할일</button><button class="${d.type==='event'?'on':''}" data-a="e-type" data-v="event">일정</button></div></div></div>

    <div class="sec"><h4>체크리스트</h4>
      ${d.checklist.map((c,i)=>`<div class="clrow ${c.done?'done':''}"><button class="ck sm ${c.done?'on':''}" data-a="e-cl" data-i="${i}">${I.check}</button><span>${esc(c.text)}</span><button class="rm" data-a="e-cl-del" data-i="${i}">${I.x}</button></div>`).join('')}
      <div class="cladd"><input id="clIn" placeholder="새 항목 추가..." enterkeyhint="done" maxlength="120"><button data-a="e-cl-add">${I.plus}</button></div></div>

    <div class="sec"><div class="srow"><h4>매트릭스 영역</h4><span class="qlabel">${Q[d.quadrant].label}</span></div>
      <div class="qopts">${Q.map((q,i)=>`<button class="qopt ${i===d.quadrant?'on':''}" data-a="e-q" data-v="${i}">${qIcon(i,i===d.quadrant,34)}${q.name}</button>`).join('')}</div></div>

    <div class="sec"><h4>상위 할 일</h4>
      ${parent?`<div class="pcard">${I.link}<span>${esc(parent.title)}</span><button class="rm" data-a="e-unparent" style="color:#8e8e93">${I.x}</button></div>`
      :`<button class="plink" data-a="e-parent">${I.link} 상위 할 일 연결하기</button>`}</div>

    <div class="sec"><h4>컬러 그룹</h4>
      <div class="colors">${COLORS.map(c=>`<button class="dot ${c===d.color?'on':''}" style="background:${c}" data-a="e-color" data-v="${c}">${c===d.color?I.check:''}</button>`).join('')}</div></div>

    <div class="sec"><div class="srow"><h4>반복</h4><button class="sw ${d.repeat?'on':''}" data-a="e-sw" data-v="repeat"></button></div>
      ${d.repeat?`<div class="hr"></div><div class="srow"><h4 style="font-weight:500">주기</h4><div class="seg" style="width:210px">${[['daily','매일'],['weekly','매주'],['monthly','매월']].map(([k,l])=>`<button class="${d.repeatType===k?'on':''}" data-a="e-rep" data-v="${k}">${l}</button>`).join('')}</div></div>`:''}</div>

    <div class="sec"><div class="srow"><h4>날짜 지정</h4><button class="sw ${d.hasDate?'on':''}" data-a="e-sw" data-v="hasDate"></button></div>
      ${d.hasDate?`<div class="hr"></div>
      <div class="srow"><h4>시작일</h4><label class="dchip">${dotted(d.start)}<input type="date" data-in="start" value="${d.start}"></label></div>
      <div class="srow" style="margin-top:12px"><h4>종료일</h4><label class="dchip">${dotted(d.end)}<input type="date" data-in="end" value="${d.end}"></label></div>
      <div class="hr"></div>
      <div class="srow"><h4>시간 설정</h4><button class="sw ${d.hasTime?'on':''}" data-a="e-sw" data-v="hasTime"></button></div>
      ${d.hasTime?`<div class="srow" style="margin-top:12px"><h4 style="font-weight:500">시간</h4><label class="dchip">${d.time}<input type="time" data-in="time" value="${d.time}"></label></div>`:''}`:''}</div>

    ${editingId?`<button class="delbtn" data-a="e-del">삭제</button>`:''}
  </div></div>`;
  m.querySelector('.mbody').scrollTop=sc;
  if(first&&!editingId)setTimeout(()=>{const i=m.querySelector('[data-in=title]');if(i&&!preset_noFocus)i.focus()},320);
}
let preset_noFocus=false;
function saveDraft(){
  if(!draft.title.trim()){toast('할 일 내용을 입력하세요');$('[data-in=title]')?.focus();return}
  draft.title=draft.title.trim();
  const wasEdit=!!editingId;
  if(wasEdit){const i=S.tasks.findIndex(t=>t.id===editingId);if(i>=0)S.tasks[i]=draft;else S.tasks.push(draft)}else S.tasks.push(draft);
  if(draft.hasDate&&ui.tab==='calendar'){const d=parse(draft.start);ui.y=d.getFullYear();ui.m=d.getMonth();ui.sel=draft.start}
  save();closeEditor();render();toast(wasEdit?'수정했어요':'추가했어요');
}
function addChecklist(){const i=$('#clIn');const v=i&&i.value.trim();if(!v)return;draft.checklist.push({text:v,done:false});renderEditor();setTimeout(()=>$('#clIn')?.focus(),0)}
function descendants(id){const out=new Set([id]);let ch=true;while(ch){ch=false;for(const t of S.tasks){if(t.parentId&&out.has(t.parentId)&&!out.has(t.id)){out.add(t.id);ch=true}}}return out}

/* ---------- sheets ---------- */
function sheet(html){$('#sheet').innerHTML=html?`<div class="bg" data-a="sheet-close"></div><div class="panel"><div class="grab"></div>${html}</div>`:''}
const SHEETS={
  settings:()=>`<h3>설정</h3>
    <div class="prow" data-a="set-hide"><span>완료한 항목 숨기기</span><span class="sw ${S.settings.hideDone?'on':''}"></span></div>
    <div class="prow" data-a="set-compact"><span>매트릭스 영역 이름 표시</span><span class="sw ${S.settings.compact?'on':''}"></span></div>
    <button class="prow" data-a="export"><span>데이터 백업 (JSON 저장)</span><span class="r">${S.tasks.length}개</span></button>
    <label class="prow"><span>백업 불러오기</span><span class="r">파일 선택</span><input type="file" accept="application/json,.json" data-in="import" hidden></label>
    <button class="prow" data-a="clear-done"><span>완료한 할 일 모두 지우기</span></button>
    <button class="prow red" data-a="reset"><span>모든 데이터 삭제</span></button>`,
  help:()=>`<div class="help"><h3>아이젠하워 매트릭스</h3><p>할 일을 중요도와 긴급도로 나눠 무엇부터 할지 정해요. 빈 칸을 누르면 그 영역에 바로 추가돼요.</p>
    ${Q.map((q,i)=>`<div class="hq">${qIcon(i,true,30)}<div><b>${q.name} · ${q.label}</b><span>${q.desc}</span></div></div>`).join('')}</div>`,
  filter:()=>`<h3>필터</h3><div class="chips">${['all',...GROUPS].map(g=>`<button class="${S.settings.group===g?'on':''}" data-a="set-group" data-v="${g}">${g==='all'?'전체':g}</button>`).join('')}</div>
    <div class="prow" data-a="set-hide"><span>완료한 항목 숨기기</span><span class="sw ${S.settings.hideDone?'on':''}"></span></div>`,
  sort:()=>`<h3>정렬</h3>${[['created','추가한 순'],['date','날짜 순'],['name','이름 순'],['undone','미완료 먼저']].map(([k,l])=>`<button class="prow" data-a="set-sort" data-v="${k}"><span>${l}</span><span class="rad ${S.settings.sort===k?'on':''}"></span></button>`).join('')}`,
  parent:()=>{const ex=descendants(draft.id);const list=S.tasks.filter(t=>!ex.has(t.id));
    return `<h3>상위 할 일 선택</h3>${list.length?list.map(t=>`<button class="prow" data-a="pick-parent" data-id="${t.id}"><span>${esc(t.title)}</span>${qIcon(t.quadrant,!t.done,22)}</button>`).join(''):'<div class="empty" style="padding:30px">연결할 수 있는 할 일이 없어요</div>'}`}
};
const openSheet=k=>sheet(SHEETS[k]());

/* ---------- actions ---------- */
const find=id=>S.tasks.find(t=>t.id===id);
const A={
  tab:el=>{ui.tab=el.dataset.v;ui.fab=false;ui.chatSel=null;render()},
  toggle:el=>{const t=find(el.dataset.id);if(!t)return;t.done=!t.done;save();render()},
  open:el=>{const t=find(el.dataset.id);if(t)openEditor(t)},
  new:el=>{const p={};if(el.dataset.q!=null)p.quadrant=+el.dataset.q;
    if(el.dataset.d){p.start=p.end=el.dataset.d}
    if(el.dataset.ev){p.type='event'}
    if(ui.tab==='calendar'&&!el.dataset.d){p.start=p.end=ui.sel}
    openEditor(null,p)},
  fab:()=>{ui.fab=!ui.fab;render()},
  gomatrix:()=>{ui.tab='matrix';render()},
  layout:()=>{S.settings.compact=!S.settings.compact;save();render();toast(S.settings.compact?'영역 이름 표시':'영역 이름 숨김')},
  settings:()=>openSheet('settings'),help:()=>openSheet('help'),filter:()=>openSheet('filter'),sort:()=>openSheet('sort'),
  'sheet-close':()=>sheet(''),
  'set-hide':()=>{S.settings.hideDone=!S.settings.hideDone;save();render();openSheet($('#sheet .panel h3').textContent==='필터'?'filter':'settings')},
  'set-compact':()=>{S.settings.compact=!S.settings.compact;save();render();openSheet('settings')},
  'set-group':el=>{S.settings.group=el.dataset.v;save();render();openSheet('filter')},
  'set-sort':el=>{S.settings.sort=el.dataset.v;save();render();sheet('')},
  export:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`matrix-todo-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  'clear-done':()=>{const n=S.tasks.filter(t=>t.done).length;if(!n){toast('완료한 할 일이 없어요');return}
    if(!confirm(`완료한 할 일 ${n}개를 지울까요?`))return;const gone=new Set(S.tasks.filter(t=>t.done).map(t=>t.id));
    S.tasks=S.tasks.filter(t=>!t.done);S.tasks.forEach(t=>{if(gone.has(t.parentId))t.parentId=null});save();render();sheet('');toast('지웠어요')},
  reset:()=>{if(!confirm('모든 할 일과 메모를 삭제할까요? 되돌릴 수 없어요.'))return;S={tasks:[],chats:[],settings:defSettings()};save();render();sheet('');toast('초기화했어요')},
  day:el=>{ui.sel=el.dataset.d;const d=parse(ui.sel);if(d.getMonth()!==ui.m){ui.y=d.getFullYear();ui.m=d.getMonth()}render()},
  'cal-today':()=>{const n=new Date();ui.y=n.getFullYear();ui.m=n.getMonth();ui.sel=today();render()},
  'chat-send':()=>{const i=$('#chatIn');const v=i.value.trim();if(!v)return;S.chats.push({id:uid(),text:v,ts:Date.now()});i.value='';save();render();$('#chatIn').focus()},
  msg:el=>{ui.chatSel=ui.chatSel===el.dataset.id?null:el.dataset.id;render()},
  'msg-task':el=>{const c=S.chats.find(x=>x.id===el.dataset.id);ui.chatSel=null;if(c)openEditor(null,{title:c.text.slice(0,200)})},
  'msg-copy':el=>{const c=S.chats.find(x=>x.id===el.dataset.id);ui.chatSel=null;render();if(c&&navigator.clipboard)navigator.clipboard.writeText(c.text).then(()=>toast('복사했어요'),()=>{})},
  'msg-del':el=>{S.chats=S.chats.filter(x=>x.id!==el.dataset.id);ui.chatSel=null;save();render()},
  /* editor */
  'e-close':()=>closeEditor(),
  'e-save':()=>saveDraft(),
  'e-type':el=>{draft.type=el.dataset.v;renderEditor()},
  'e-q':el=>{draft.quadrant=+el.dataset.v;renderEditor()},
  'e-color':el=>{draft.color=el.dataset.v;renderEditor()},
  'e-sw':el=>{const k=el.dataset.v;draft[k]=!draft[k];if(k==='hasDate'&&draft.hasDate&&!draft.start){draft.start=draft.end=today()}renderEditor()},
  'e-rep':el=>{draft.repeatType=el.dataset.v;renderEditor()},
  'e-cl':el=>{const c=draft.checklist[+el.dataset.i];c.done=!c.done;renderEditor()},
  'e-cl-del':el=>{draft.checklist.splice(+el.dataset.i,1);renderEditor()},
  'e-cl-add':()=>addChecklist(),
  'e-parent':()=>openSheet('parent'),
  'e-unparent':()=>{draft.parentId=null;renderEditor()},
  'pick-parent':el=>{draft.parentId=el.dataset.id;sheet('');renderEditor()},
  'e-del':()=>{if(!confirm('이 할 일을 삭제할까요?'))return;const id=editingId;S.tasks=S.tasks.filter(t=>t.id!==id);
    S.tasks.forEach(t=>{if(t.parentId===id)t.parentId=null});save();closeEditor();render();toast('삭제했어요')}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f){e.preventDefault();e.stopPropagation();f(el,e)}
});
function onField(e,isChange){
  const el=e.target;const k=el.dataset.in;if(!k)return;const v=el.value;
  if(k==='import'){if(!isChange)return;const file=el.files[0];if(!file)return;file.text().then(txt=>{try{const d=JSON.parse(txt);if(!Array.isArray(d.tasks))throw 0;
      if(!confirm('현재 데이터를 백업 파일로 바꿀까요?'))return;S={tasks:d.tasks,chats:d.chats||[],settings:Object.assign(defSettings(),d.settings)};save();render();sheet('');toast('불러왔어요')}catch(_){toast('올바른 백업 파일이 아니에요')}});return}
  if(!draft)return;
  if(k==='title'){draft.title=v;$('.savebtn')?.classList.toggle('ok',!!v.trim());return}
  if(k==='group'||k==='store'){draft[k]=v;return}
  if(k==='time'){if(v)draft.time=v;if(isChange)renderEditor();return}
  if(k==='start'||k==='end'){
    if(!v||!isChange)return;
    if(k==='start'){draft.hasDate=true;const span=Math.round((parse(draft.end)-parse(draft.start))/864e5);draft.start=v;draft.end=addDays(v,Math.max(0,span||0))}
    else{draft.end=v;if(v<draft.start)draft.start=v}
    renderEditor();
  }
}
document.addEventListener('input',e=>onField(e,false));
document.addEventListener('change',e=>onField(e,true));
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing){
    if(e.target.id==='chatIn'){e.preventDefault();A['chat-send']()}
    else if(e.target.id==='clIn'){e.preventDefault();addChecklist()}
    else if(e.target.dataset?.in==='title'){e.preventDefault();e.target.blur()}
  }
  if(e.key==='Escape'){if($('#sheet').innerHTML)sheet('');else if(draft)closeEditor();else if(ui.fab){ui.fab=false;render()}}
  if(ui.tab==='calendar'&&!draft&&!$('#sheet').innerHTML&&document.activeElement===document.body){
    if(e.key==='ArrowLeft')moveMonth(-1);if(e.key==='ArrowRight')moveMonth(1);
  }
});
function moveMonth(n){const d=new Date(ui.y,ui.m+n,1);ui.y=d.getFullYear();ui.m=d.getMonth();
  const s=parse(ui.sel);if(s.getMonth()!==ui.m||s.getFullYear()!==ui.y)ui.sel=ymd(d);render()}
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(e.target.closest('#cgrid')){tx=e.touches[0].clientX;ty=e.touches[0].clientY}else tx=null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)moveMonth(dx<0?1:-1)},{passive:true});
document.addEventListener('wheel',e=>{if(!e.target.closest('#cgrid'))return;if(Math.abs(e.deltaY)<30)return;clearTimeout(moveMonth.t);moveMonth.t=setTimeout(()=>moveMonth(e.deltaY>0?1:-1),60)},{passive:true});

render();
</script>
</body>
</html>
